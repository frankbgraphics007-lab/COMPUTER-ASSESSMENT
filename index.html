<script id="up-js">
(function(){
const nz=s=>String(s||"").toUpperCase().replace(/\s+/g," ").trim();
const ACT=["active","help","paused"],DONE=["done","ended"];
let RM=null,RML=false,LY=null,LG=null,LC=null;const LSEL=new Set();
let HID={};try{HID=JSON.parse(localStorage.getItem("up_hid")||"{}");const t=Date.now();Object.keys(HID).forEach(k=>{if(t-HID[k]>864e5)delete HID[k]})}catch(e){HID={}}
const saveHid=()=>{try{localStorage.setItem("up_hid",JSON.stringify(HID))}catch(e){}};
const nat=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true});
const gOf=(sex,cls)=>{const s=String(sex||"").toUpperCase();if(s==="M")return"Boys";if(s==="F")return"Girls";const m=String(cls||"").toUpperCase().match(/^\d+\s*([BG])/);return m?(m[1]==="B"?"Boys":"Girls"):"Unknown"};
const mainName=(y,g)=>"Year "+y+" "+g;
/* ---------- 1. LIVE EXAMS: YEAR > BOYS/GIRLS > STREAM (Year 10: Boys/Girls > all students) ---------- */
function loadRM(){if(RM||RML||!REMOTE||!isStaff())return;RML=true;
 fetchAll("roster","select=name,cls,year,sex&order=id").then(d=>{RM={};(d||[]).forEach(r=>RM[nz(r.name)]=r)}).catch(()=>{RM={}}).then(()=>{RML=false;liveSig="";if($("#mgbody")&&MG.data[MG.tab])mgDraw()})}
const inf=s=>{const r=(RM&&RM[nz(s.name)])||{};return{y:+s.year||+r.year||0,g:gOf(r.sex,r.cls),c:r.cls||"Unassigned"}};
const clsOf=s=>inf(s).c;
const inScope=s=>{const i=inf(s);return(!LY||i.y===LY)&&(!LG||i.g===LG)&&(!LC||i.c===LC)};
const scopeLab=()=>[LY&&"Year "+LY,LG,LC].filter(Boolean).join(" › ")||"all";

function stuCard(s,n){
 const off=ACT.includes(s.state)&&n-(s.hb||0)>15000,v=s.viol||[],sid=esc(s.sid),live=ACT.includes(s.state),fin=DONE.includes(s.state);let btn="";
 if(s.state==="help")btn=`<button class="btn sm" data-lc="allow" data-sid="${sid}">Pause exam and allow leave</button><button class="btn sm alt" data-lc="deny" data-sid="${sid}">Not now</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
 else if(s.state==="active")btn=`<button class="btn sm alt" data-lc="allow" data-sid="${sid}">Pause and allow leave</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
 else if(s.state==="paused")btn=`<button class="btn sm" data-lc="resume" data-sid="${sid}">Resume exam</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
 else btn=`<button class="btn sm danger" data-ldel="${sid}">Delete student</button>`;
 const acked=(s.ackN||0)>=(s.msgN||0),ms=s.msgs||[];
 return `<div class="lv ${esc(s.state)}"><div class="lv-h"><input type="checkbox" data-lsel="${sid}" aria-label="Select"${LSEL.has(s.sid)?" checked":""}><strong>${esc(s.name)}</strong><span class="tag">${esc(clsOf(s))}</span><span>${esc(s.title)}</span><span class="tag ${s.state==="help"?"bad":fin?"ok":""}">${STL[s.state]||esc(s.state)}</span>${off?'<span class="tag bad">No signal</span>':""}${v.length?`<span class="tag bad">${v.length} warning${v.length>1?"s":""}</span>`:""}${s.warns?`<span class="tag bad">${s.warns} formal warning${s.warns>1?"s":""} issued</span>`:""}</div>
${s.state==="help"&&s.help?`<p class="lv-r"><b>${esc(s.help.reason)}</b>${s.help.note?" “"+esc(s.help.note)+"”":""}</p>`:""}
${v.length?`<details><summary>Activity log</summary><ul>${v.slice(-8).reverse().map(x=>`<li>${new Date(x.t).toLocaleTimeString("en-GB")} · ${esc(x.msg)}</li>`).join("")}</ul></details>`:""}
${ms.length?`<details><summary>Messages sent (${s.msgN}) · last one ${acked?"acknowledged":"waiting for the student"}</summary><ul>${ms.slice().reverse().map(x=>`<li>${new Date(x.t).toLocaleTimeString("en-GB")} · ${LV[x.level]||""}: ${esc(x.text)}</li>`).join("")}</ul></details>`:""}
${live?`<details data-ok="${sid}"${dr(s.sid).o?" open":""}><summary>Send a message to ${esc(s.name)}</summary>${compose(s.sid,s.name)}</details>`:""}
<div class="row">${btn}</div></div>`}

refreshLive=function(L){
 const box=$("#live");if(!box)return;loadRM();
 if(!box.__up){box.__up=1;box.addEventListener("click",liveClick,true)}
 const n=Date.now();
 L=L.filter(s=>{if(!HID[s.sid])return true;if(s.state==="help"){delete HID[s.sid];saveHid();return true}return false});
 L=L.slice().sort((a,b)=>(b.state==="help")-(a.state==="help")||String(a.name).localeCompare(b.name));
 const nh=L.filter(s=>s.state==="help").length,bd=$("#lvbadge");
 if(bd){bd.hidden=!nh;bd.textContent=nh}
 {const tb=$("#tbadge");if(tb){tb.hidden=!nh;tb.textContent=nh}const a=$("#tlive");if(a)a.textContent=L.filter(s=>ACT.includes(s.state)).length;const h=$("#thelp");if(h)h.textContent=nh}
 const sig=JSON.stringify([LY,LG,LC,RM?1:0,[...LSEL],L.map(s=>({...s,hb:n-(s.hb||0)>15000}))]);
 if(sig===liveSig)return;
 const ae=document.activeElement;if(ae&&box.contains(ae)&&/^(TEXTAREA|SELECT)$/.test(ae.tagName))return;
 liveSig=sig;
 if(!L.length){LY=LG=LC=null;box.innerHTML='<div class="empty">No students are in an exam right now. They appear here when they begin a secure exam.</div>';return}
 if(LY&&!L.some(s=>inf(s).y===LY))LY=LG=LC=null;
 if(LG&&!L.some(s=>inf(s).y===LY&&inf(s).g===LG))LG=LC=null;
 if(LC&&!L.some(s=>inf(s).y===LY&&inf(s).g===LG&&inf(s).c===LC))LC=null;
 const card=(lab,arr,attr,val)=>{const a=arr.filter(s=>ACT.includes(s.state)).length,h=arr.filter(s=>s.state==="help").length,d=arr.filter(s=>DONE.includes(s.state)).length;
  return `<button class="card cc${h?" help":""}" ${attr}="${esc(val)}"><h3>${esc(lab)}<span class="big">${arr.length}</span></h3><p>${a} in exam${d?`, ${d} finished/ended`:""}</p><p style="margin-top:8px">${h?`<span class="tag bad">${h} help request${h>1?"s":""}</span>`:'<span class="tag ok">No alerts</span>'}</p></button>`};
 const depth=LC?3:LG?2:LY?1:0;
 let head="",body="",stu=null;
 if(depth){head=`<div class="lvbar"><button class="btn sm alt" data-nav="${depth-1}">← Back</button><button class="btn sm alt" data-nav="0">All years</button>${depth>1?`<button class="btn sm alt" data-nav="1">Year ${LY}</button>`:""}${depth>2?`<button class="btn sm alt" data-nav="2">${esc(LG)}</button>`:""}<h3 style="font-size:1.5rem;margin:0 6px">${esc(scopeLab())}</h3></div>`}
 if(!LY){const ys=[...new Set(L.map(s=>inf(s).y))].sort((a,b)=>a-b);
  body=`<p class="note">Choose a year.</p><div class="grid">${ys.map(y=>card("Year "+y,L.filter(s=>inf(s).y===y),"data-ny",y)).join("")}</div>`}
 else{const Y=L.filter(s=>inf(s).y===LY);
  if(!LG){const gs=["Boys","Girls","Unknown"].filter(g=>Y.some(s=>inf(s).g===g));
   body=`<p class="note">Choose Boys or Girls.</p><div class="grid">${gs.map(g=>card(g,Y.filter(s=>inf(s).g===g),"data-ng",g)).join("")}</div>`}
  else{const G=Y.filter(s=>inf(s).g===LG);
   if(LY===10||LC){stu=LG===undefined?[]:G.filter(s=>LY===10||inf(s).c===LC)}
   else{const cs=[...new Set(G.map(s=>inf(s).c))].sort(nat);
    body=`<p class="note">Choose a stream.</p><div class="grid">${cs.map(c=>card(c,G.filter(s=>inf(s).c===c),"data-nc",c)).join("")}</div>`}}}
 const act=L.filter(s=>ACT.includes(s.state)&&(!LY||inScope(s)));
 const msg=act.length>1?(!LY?`<details class="lv all" data-ok="ALL"${dr("ALL").o?" open":""}><summary><b>Message all students in exams (${act.length})</b></summary>${compose("ALL","all "+act.length+" students")}</details>`
  :`<details class="lv all" data-ok="CLASS"${dr("CLASS").o?" open":""}><summary><b>Message all in ${esc(scopeLab())} (${act.length})</b></summary>${compose("CLASS","all "+act.length+" students in "+scopeLab())}</details>`):"";
 let list="";
 if(stu){const fin=stu,selN=fin.filter(s=>LSEL.has(s.sid)).length;
  list=`<p class="note">${stu.length} student${stu.length===1?"":"s"}${LY===10?" (all Year 10 "+esc(LG)+", streams not separated)":""}.</p>`+
  (fin.length?`<div class="lvbar"><label class="chk" style="margin:0"><input type="checkbox" data-lselall="1"${selN&&selN===fin.length?" checked":""}>Select all (${fin.length})</label><button class="btn sm danger" data-ldelsel="1"${selN?"":" disabled"}>Delete selected (${selN})</button></div>`:"")+
  stu.map(s=>stuCard(s,n)).join("")}
 box.innerHTML=head+msg+body+list}

async function delStudents(sids){
 const L=await Live.list(),S=L.filter(s=>sids.includes(s.sid)),act=S.filter(s=>ACT.includes(s.state)).length,nm=sids.length===1?((S[0]||{}).name||"this student"):sids.length+" students";
 const w=`<b>Warning:</b> delete <b>${esc(nm)}</b> from the live list? Their live record, activity log and messages will be erased. This cannot be undone. Results already submitted are not affected.`+(act?`<br><br><b>${act}</b> of them are still in the exam. Deleting does <b>not</b> stop them or send them back: their exams continue and they can still submit. They are only removed from this list.`:"");
 if(!await confirmBox(w,sids.length>=3?"DELETE":""))return;
 for(const sid of sids){await Live.remove(sid);HID[sid]=Date.now();LSEL.delete(sid)}
 saveHid();toast("Deleted.");liveSig="";refreshLive(await Live.list())}
function endDialog(sid){
 const o=mgModal(`<h2>End this exam?</h2><p>The student's exam stops and they are taken out of the exam screen.</p><div class="row"><button class="btn danger" id="ed1">End exam</button><button class="btn danger" id="ed2">End exam and delete student</button><button class="btn alt" id="ed0">Cancel</button></div><p class="note">"End exam and delete" removes the student from this list once their device confirms the exam has ended. Submitted results are not affected.</p>`);
 const redraw=async()=>{liveSig="";refreshLive(await Live.list())};
 o.querySelector("#ed0").onclick=()=>o.remove();
 o.querySelector("#ed1").onclick=async()=>{o.remove();await Live.command(sid,"end");redraw()};
 o.querySelector("#ed2").onclick=async()=>{o.remove();toast("Ending the exam…");await Live.command(sid,"end");let ok=false;
  for(let i=0;i<8&&!ok;i++){await new Promise(r=>setTimeout(r,2000));const s=(await Live.list()).find(x=>x.sid===sid);ok=!s||DONE.includes(s.state)}
  await Live.remove(sid);HID[sid]=Date.now();saveHid();LSEL.delete(sid);
  toast(ok?"Exam ended and student deleted.":"Student deleted. Their device had not confirmed the end yet.");redraw()}}
async function liveClick(e){
 const t=e.target,redraw=async()=>{liveSig="";refreshLive(await Live.list())};
 let b;
 if(b=t.closest('[data-lc="end"]')){e.stopPropagation();return endDialog(b.dataset.sid)}
 if(b=t.closest("[data-ny]")){LY=+b.dataset.ny;LG=LC=null;return redraw()}
 if(b=t.closest("[data-ng]")){LG=b.dataset.ng;LC=null;return redraw()}
 if(b=t.closest("[data-nc]")){LC=b.dataset.nc;return redraw()}
 if(b=t.closest("[data-nav]")){const d=+b.dataset.nav;if(d<=0)LY=null;if(d<=1)LG=null;LC=null;return redraw()}
 if(b=t.closest("[data-ldel]"))return delStudents([b.dataset.ldel]);
 if(t.closest("[data-ldelsel]"))return delStudents([...LSEL]);
 if(b=t.closest("[data-lsel]")){b.checked?LSEL.add(b.dataset.lsel):LSEL.delete(b.dataset.lsel);return redraw()}
 if(b=t.closest("[data-lselall]")){const L=await Live.list();L.filter(s=>inScope(s)).forEach(s=>b.checked?LSEL.add(s.sid):LSEL.delete(s.sid));return redraw()}
 if((b=t.closest("[data-send]"))&&b.dataset.send==="CLASS"){
  e.stopPropagation();const m=msgOf("CLASS");if(!m.text){toast("Write your message first.");return}
  const L=await Live.list(),T=L.filter(s=>ACT.includes(s.state)&&inScope(s));if(!T.length){toast("No students in an exam here.");return}
  for(const s of T)await Live.message(s.sid,m);
  if(dr("CLASS").p==="custom")dr("CLASS").t="";
  toast(`${LV[m.level]} sent to ${T.length} students (${scopeLab()}).`);redraw()}}

/* ---------- 2. ITEM ANALYSIS + ACADEMIC REPORT ---------- */
const pc=(a,b)=>b?Math.round(a/b*100):0,stt=p=>p<50?["Re-teach","bad"]:p<70?["Revise","mid"]:["Secure","ok"];
const cut=(s,n)=>{s=strip(s);return s.length>n?s.slice(0,n)+"…":s};
async function analyse(list,btn){
 const old=btn.textContent;btn.disabled=true;
 try{
  const ids=list.map(r=>r.id),all=[];
  for(let i=0;i<ids.length;i+=40){btn.textContent="Loading "+Math.min(i+40,ids.length)+"/"+ids.length+"…";
   const r=await rows("results","id=in."+enc("("+ids.slice(i,i+40).join(",")+")")+"&select=*");if(!r.ok)throw new Error("Could not load results. Log in again.");all.push(...(r.j||[]))}
  const by={};all.forEach(r=>(by[r.aid]=by[r.aid]||[]).push(r));const reps=[];
  for(const aid of Object.keys(by)){
   const R=by[aid],key=await getKey(aid),D=R.filter(r=>Array.isArray(r.detail)&&r.detail.length);let Q=qList(key);
   if(!Q.length&&D.length)Q=D[0].detail.map((d,i)=>({id:d.id,n:i+1,si:0,sec:"",marks:0,prompt:"Question "+(i+1)}));
   const qs={};Q.forEach(q=>{if(!q.marks)q.marks=Math.max(1,...D.map(r=>{const d=r.detail.find(x=>x.id===q.id);return d?+d.e||0:0}));qs[q.id]={q,n:0,e:0,full:0,wr:{},cor:""}});
   D.forEach(r=>r.detail.forEach(d=>{const o=qs[d.id];if(!o)return;o.n++;o.e+=+d.e||0;if(d.c&&!o.cor)o.cor=d.c;
    if((+d.e||0)>=o.q.marks-1e-9)o.full++;else{const g=strip(d.g)||"No answer given";o.wr[g]=(o.wr[g]||0)+1}}));
   const items=Object.values(qs).filter(o=>o.n).map(o=>{const w=Object.entries(o.wr).sort((a,b)=>b[1]-a[1])[0];return{...o,pct:pc(o.e,o.q.marks*o.n),fp:pc(o.full,o.n),top:w?w[0]:"",topN:w?w[1]:0}});
   const S={};items.forEach(o=>{const k=o.q.si,s=S[k]=S[k]||{name:o.q.sec||"General",e:0,p:0,it:[]};s.e+=o.e;s.p+=o.q.marks*o.n;s.it.push(o)});
   const secs=Object.values(S).map(s=>({...s,pct:pc(s.e,s.p)})).sort((a,b)=>a.pct-b.pct);
   const dist={};R.forEach(r=>dist[r.grade]=(dist[r.grade]||0)+1);
   reps.push({title:R[0].title,N:R.length,mean:Math.round(R.reduce((t,r)=>t+(+r.pct||0),0)/R.length),pass:R.filter(r=>r.pct>=50).length,dist,items,secs,low:R.filter(r=>r.pct<50).sort((a,b)=>a.pct-b.pct),noD:R.length-D.length,cls:[...new Set(R.map(r=>r.cls))].join(", ")})}
  showReport(reps)}
 catch(e){toast(e.message||"Could not build the analysis.")}
 btn.disabled=false;btn.textContent=old}

function repHtml(reps){
 const bar=(p,c)=>`<div class="bar"><i class="${c}" style="width:${p}%"></i></div>`;
 return reps.map(R=>{
  const worst=R.items.slice().sort((a,b)=>a.pct-b.pct).slice(0,10),weak=R.secs.filter(s=>s.pct<70);
  return `<h2>${sx(R.title)}</h2><p style="margin:0;color:var(--mut,#5b6580)">Classes: ${sx(R.cls)}</p>
<div class="k"><div><b>${R.N}</b>Students</div><div><b>${R.mean}%</b>Class average</div><div><b>${pc(R.pass,R.N)}%</b>Pass rate (50%+)</div><div><b>${R.low.length}</b>Below 50%</div></div>
<h3>Grade distribution</h3><table>${["A","B","C","D","F"].map(g=>`<tr><td style="width:40px"><b>${g}</b></td><td>${bar(pc(R.dist[g]||0,R.N),g==="F"?"bad":g==="D"||g==="C"?"mid":"ok")}</td><td style="width:90px">${R.dist[g]||0} (${pc(R.dist[g]||0,R.N)}%)</td></tr>`).join("")}</table>
<h3>Concepts to revisit</h3>${R.secs.length?R.secs.map(s=>{const [lab,c]=stt(s.pct),f=s.it.filter(o=>o.pct<60).sort((a,b)=>a.pct-b.pct).slice(0,3);
   return `<div class="rec ${c}"><b>${sx(s.name)}</b> <span class="chip ${c}">${lab}</span> class scored ${s.pct}% on this topic.${s.pct<50?" Re-teach it from the basics before the next assessment.":s.pct<70?" Revise with targeted practice and worked examples.":" Well understood. Keep it in regular retrieval practice."}${f.length?`<ul>${f.map(o=>`<li>Focus: ${sx(cut(o.q.prompt,120))} (${o.pct}% scored${o.top?`; most common answer: “${sx(cut(o.top,50))}”`:""})</li>`).join("")}</ul>`:""}</div>`}).join(""):'<p>No question details available for this exam.</p>'}
${weak.length?`<p><b>Priority order for re-teaching:</b> ${weak.map(s=>sx(s.name)+" ("+s.pct+"%)").join(", ")}.</p>`:""}
<h3>Most missed questions</h3><div style="overflow-x:auto"><table><tr><th>Q</th><th>Question</th><th>Avg mark</th><th>Fully correct</th><th>Common wrong answer</th><th>Correct answer</th></tr>${worst.map(o=>{const [lab,c]=stt(o.pct);return `<tr><td>${o.q.n}</td><td>${sx(cut(o.q.prompt,140))}</td><td>${bar(o.pct,c)}${o.pct}%</td><td>${o.fp}%</td><td>${sx(cut(o.top,60))}${o.topN?` (${o.topN})`:""}</td><td>${sx(cut(o.cor,60))}</td></tr>`}).join("")}</table></div>
<h3>Full item analysis</h3><div style="overflow-x:auto"><table><tr><th>Q</th><th>Topic</th><th>Marks</th><th>Avg mark</th><th>Status</th></tr>${R.items.map(o=>{const [lab,c]=stt(o.pct);return `<tr><td>${o.q.n}</td><td>${sx(o.q.sec)}</td><td>${o.q.marks}</td><td>${bar(o.pct,c)}${o.pct}%</td><td><span class="chip ${c}">${lab}</span></td></tr>`}).join("")}</table></div>
<h3>Students who need support (below 50%)</h3>${R.low.length?`<p>${R.low.map(r=>sx(r.name)+" ("+sx(r.cls)+", "+r.pct+"%)").join("; ")}.</p>`:"<p>None. Every student passed.</p>"}${R.noD?`<p class="note">${R.noD} result(s) have no question details and are not in the question analysis.</p>`:""}`}).join("")}
function reportCsv(reps){const c=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
 return "\ufeffExam,Q,Topic,Question,Marks,Attempts,Fully correct %,Average mark %,Common wrong answer,Times chosen,Correct answer\n"+reps.flatMap(R=>R.items.map(o=>[R.title,o.q.n,o.q.sec,strip(o.q.prompt),o.q.marks,o.n,o.fp,o.pct,o.top,o.topN,o.cor].map(c).join(","))).join("\n")}
function showReport(reps){
