<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Computer Assessment Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky navy bar, hero with school logo plate, card grids for subject > year > category, full-screen exam shell for HTML exams. */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--navy:#0b1a3a;--royal:#1d3f8f;--gold:#b8923a;--goldl:#e9d9ae;--bg:#f5f6f9;--card:#ffffff;--ink:#16213b;--mut:#5b6580;--line:#dfe3ec;--ok:#1d7a4d;--bad:#a8322d;--link:#1d3f8f;--msg-bg:#fbf3de;--msg-ink:#5a4410;--msg-line:#e9d9ae;--bad-bg:#fbe9e8;--bad-line:#e8b9b6;--field:#f5f6f9;--good-bg:#e9f6ee;--good-ink:#14532d;--good-line:#9bd3b3;
 --serif:"Cormorant Garamond",Georgia,serif;--sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--card:#111d3a;--ink:#eef1f8;--mut:#9aa6c4;--line:#243258;--link:#9db7ff;--msg-bg:#2a2412;--msg-ink:#ecd9a0;--msg-line:#5a4a1c;--bad-bg:#2f1514;--bad-ink:#ffb4ae;--bad-line:#6b2a27;--bad:#ff8f87;--ok:#5fd29a;--field:#0a1226;--good-bg:#10281b;--good-ink:#9fe3bb;--good-line:#25573a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1226;--card:#111d3a;--ink:#eef1f8;--mut:#9aa6c4;--line:#243258;--link:#9db7ff;--msg-bg:#2a2412;--msg-ink:#ecd9a0;--msg-line:#5a4a1c;--bad-bg:#2f1514;--bad-ink:#ffb4ae;--bad-line:#6b2a27;--bad:#ff8f87;--ok:#5fd29a;--field:#0a1226;--good-bg:#10281b;--good-ink:#9fe3bb;--good-line:#25573a;color-scheme:dark}
:root{--bad-ink:#a8322d}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans)}
body.exam-on{overflow:hidden}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.1;color:var(--ink);text-wrap:balance}
h2{font-size:1.7rem}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
header{background:var(--navy);border-bottom:3px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.bar{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px}
.brand{display:flex;gap:12px;align-items:center;color:#fff;min-width:0}
.plate{background:#fff;border-radius:4px;padding:4px 8px;display:flex;align-items:center;flex:none}
.plate img{height:34px;width:auto;display:block}
.brand .txt{font-family:var(--serif);font-weight:700;font-size:1.3rem;letter-spacing:.06em;white-space:nowrap}
@media(max-width:520px){.brand .txt{font-size:1rem;letter-spacing:.03em}.plate img{height:28px}}
@media(max-width:380px){.brand .txt{display:none}}
nav{display:flex;gap:4px}
nav a{color:#c9d3ee;padding:8px 14px;font-weight:600;font-size:.88rem;letter-spacing:.05em;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav a:hover{color:#fff;border-color:rgba(233,217,174,.5)}nav a.on{color:var(--goldl);border-color:var(--gold)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.75rem;text-align:center}
#mb{display:none;background:none;border:1px solid #3a4c82;color:#fff;padding:6px 12px;border-radius:4px}
@media(max-width:760px){#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--navy);flex-direction:column;padding:8px 16px 16px}nav.open{display:flex}}
main{max-width:1120px;margin:auto;padding:32px 16px 64px;min-height:70vh}
.hero{background:linear-gradient(135deg,var(--navy),#14307a);color:#fff;border-radius:6px;padding:56px 40px;border-bottom:4px solid var(--gold);display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center}
.hero>div{min-width:0}
.hero h1{color:#fff;font-size:clamp(2.3rem,7vw,4.4rem);letter-spacing:.04em;font-weight:700}
.hero p{color:var(--goldl);font-size:1.2rem;max-width:46ch;margin:14px 0 28px}
.hero .plate{padding:22px 26px;border-bottom:4px solid var(--gold);border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.hero .plate img{height:150px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:36px 24px}.hero .plate{order:-1;justify-self:start}.hero .plate img{height:96px}}
/* Buttons and cards: gold glow and a light ring that travels around the outside edge on hover or keyboard focus */
.btn,a.card,button.card{position:relative;isolation:isolate;transition:transform .25s,box-shadow .3s,background .2s,border-color .2s}
.btn{display:inline-block;padding:11px 22px;border-radius:4px;font-weight:600;border:1px solid var(--gold);background:var(--gold);color:#0b1a3a;--r:4px;line-height:1.3}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(233,217,174,.6)}
.btn.alt{background:transparent;color:var(--link);border-color:var(--line)}
.btn.sm{padding:6px 14px;font-size:.88rem}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.card,button.card{--r:6px}
.btn::before,a.card::before,button.card::before{content:"";position:absolute;inset:-4px;border-radius:calc(var(--r) + 4px);padding:2px;pointer-events:none;z-index:-1;opacity:0;transition:opacity .3s;
 background:conic-gradient(from var(--a),transparent 0 55%,rgba(184,146,58,.9) 85%,#fff 100%),linear-gradient(rgba(184,146,58,.35),rgba(184,146,58,.35));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
 animation:orbit 2.4s linear infinite paused}
@keyframes orbit{to{--a:360deg}}
.btn:not(:disabled):is(:hover,:focus-visible)::before,a.card:is(:hover,:focus-visible)::before,button.card:is(:hover,:focus-visible)::before{opacity:1;animation-play-state:running}
.btn:not(:disabled):is(:hover,:focus-visible){transform:translateY(-1px);box-shadow:0 0 18px rgba(184,146,58,.55),0 6px 16px rgba(0,0,0,.18)}
.btn:not(.ghost):not(.alt):not(.danger):not(:disabled):hover{background:var(--goldl)}
.btn.ghost:not(:disabled):hover{background:rgba(184,146,58,.16)}
.btn.alt:not(:disabled):hover{background:rgba(184,146,58,.1)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--royal);border-radius:6px;padding:22px;box-shadow:0 2px 10px rgba(11,26,58,.06);display:block;min-width:0}
a.card:hover,button.card:hover{transform:translateY(-3px);border-top-color:var(--gold);box-shadow:0 0 22px rgba(184,146,58,.4),0 10px 24px rgba(11,26,58,.16)}
.card h3{font-size:1.5rem;margin-bottom:6px;overflow-wrap:anywhere}.card p{margin:0;color:var(--mut);font-size:.95rem}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border:1px solid var(--line);border-radius:20px;color:var(--mut);margin:0 6px 4px 0}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.crumb{color:var(--mut);font-size:.9rem;margin-bottom:10px}.crumb a{color:var(--link);font-weight:600}.crumb a:hover{text-decoration:underline}
.ph h1{font-size:clamp(2rem,5vw,3rem)}.ph p{color:var(--mut);margin:8px 0 0}
.rule{height:3px;width:64px;background:var(--gold);margin:14px 0 0}
.empty{border:1px dashed var(--line);border-radius:6px;padding:40px 20px;text-align:center;color:var(--mut);margin-top:24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px;margin-top:22px;min-width:0}
.gate{max-width:640px}
.rules{padding-left:20px;margin:12px 0 0;display:grid;gap:8px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink);font:inherit}
input[type=radio],input[type=checkbox]{width:auto}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:10px 0 0}
.two{display:grid;gap:14px;grid-template-columns:1fr 1fr}@media(max-width:640px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:.93rem}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw{overflow-x:auto}
.msg{padding:10px 14px;border-radius:4px;margin-top:14px;font-size:.92rem;background:var(--msg-bg);color:var(--msg-ink);border:1px solid var(--msg-line)}
.msg.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
.viewer{width:100%;height:78vh;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:16px}
.viewer.img{height:auto;max-height:80vh;object-fit:contain}
.note{font-size:.85rem;color:var(--mut);margin-top:10px}
footer{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:.85rem;padding:24px 16px;border-top:1px solid var(--line)}
footer .plate{border:1px solid var(--line)}footer .plate img{height:30px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:6px;z-index:3000;max-width:min(92vw,520px);box-shadow:0 0 20px rgba(184,146,58,.4)}
/* Live panel (staff) */
.lv{border:1px solid var(--line);border-left:4px solid var(--royal);border-radius:6px;padding:14px 16px;margin-top:12px;background:var(--card)}
.lv.help{border-left-color:var(--bad);background:var(--bad-bg)}
.lv.paused{border-left-color:var(--gold)}.lv.done,.lv.ended{border-left-color:var(--ok)}
.lv-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lv-h strong{font-size:1.05rem}
.lv details{margin-top:8px;font-size:.88rem;color:var(--mut)}.lv ul{margin:6px 0 0;padding-left:18px}
.lv-r{margin:8px 0 0}
/* Exam shell */
.ex{position:fixed;inset:0;z-index:1000;background:var(--navy);display:flex;flex-direction:column;color:#fff}
.ex-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--navy);border-bottom:2px solid var(--gold);flex-wrap:wrap}
.ex-bar .plate img{height:30px}
.ex-t{font-family:var(--serif);font-weight:700;font-size:1.2rem;flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-st{font-size:.82rem;font-weight:600;padding:3px 12px;border-radius:20px;border:1px solid var(--goldl);color:var(--goldl)}
.ex-st.bad{border-color:#ff8f87;color:#ff8f87}.ex-st.ok{border-color:#5fd29a;color:#5fd29a}
.ex-body{flex:1;min-height:0;background:#fff;position:relative}
.ex-body iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.cover{position:absolute;inset:0;background:var(--navy);display:grid;place-items:center;padding:24px;z-index:5;text-align:center}
.cv{max-width:480px}.cv h2{color:#fff;font-size:2rem}.cv p{color:#c9d3ee;margin:12px 0 22px}
.hm{background:var(--card);color:var(--ink);border-radius:6px;border-top:4px solid var(--gold);padding:24px;max-width:480px;width:100%;text-align:left;max-height:100%;overflow:auto}
.hm h2{color:var(--ink)}.hm fieldset{border:0;padding:0;margin:14px 0 0}.hm legend{font-weight:600;margin-bottom:4px;padding:0}
summary{cursor:pointer;font-weight:600}
.msg.good{background:var(--good-bg);color:var(--good-ink);border-color:var(--good-line)}
/* Teacher message composer */
.cmp{display:grid;gap:2px;margin-top:8px;color:var(--ink)}
.cmp-p{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--gold);background:var(--field);font-size:.9rem;color:var(--ink)}
.cmp-p:empty{display:none}
.lv.all{border-left-color:var(--gold)}
.lv>details>summary{color:var(--ink)}
/* Formal notice shown to a student */
#exmsg{z-index:50;background:rgba(6,14,32,.9)}
.nt{background:var(--card);color:var(--ink);width:min(560px,100%);border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:left;max-height:100%;overflow-y:auto}
.nt-h{display:flex;gap:14px;align-items:center;padding:14px 18px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.nt-h .plate img{height:38px}
.nt-k{font:700 1.3rem/1.1 var(--serif);letter-spacing:.05em;text-transform:uppercase}
.nt-s{font-size:.8rem;color:var(--goldl)}
.nt.w .nt-h{background:#5a3d06;border-bottom-color:#e0a21a}
.nt.f .nt-h{background:#6e1b17;border-bottom-color:#ff8f87}
.nt-b{padding:22px 24px 24px}
.nt-b h2{font-size:1.8rem}
.nt-m{margin:14px 0 0;font-size:1.12rem;line-height:1.5}
.nt-w{margin:14px 0 0;font-weight:600;color:var(--bad)}
.nt-f{margin:14px 0 0;font-size:.85rem;color:var(--mut)}
.dh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 12px;border-radius:20px;background:var(--navy);color:var(--goldl);font-size:.8rem;font-weight:600;border:1px solid var(--gold)}
.dtabs{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 6px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:5}
.dt{appearance:none;border:0;background:transparent;color:var(--ink);padding:9px 16px;border-radius:6px;font-weight:600;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none;transition:background .2s,color .2s}
.dt:hover{background:rgba(184,146,58,.14)}.dt.on{background:var(--navy);color:var(--goldl)}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:12px 16px;display:flex;flex-direction:column}
.tile b{font:700 1.8rem/1.1 var(--serif)}.tile span{color:var(--mut);font-size:.82rem}
th{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}tr:hover td{background:rgba(184,146,58,.07)}
.panel h2{font-size:1.45rem;padding-bottom:8px;border-bottom:2px solid var(--line);margin-bottom:12px}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,146,58,.2);outline:none}
@media(max-width:640px){.dtabs{overflow-x:auto;flex-wrap:nowrap}.dt{white-space:nowrap}}
@media(prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
</style>

  if(r.status===401&&ss_get("ca_tok")){try{sessionStorage.removeItem("ca_staff");sessionStorage.removeItem("ca_tok")}catch(e){}}

/* Splits an exam into a PUBLIC page (no answers) and a PRIVATE answer key that stays on the server. */
function isPubBody(url){try{const m=dataToText(url).match(/<script id="exam-data" type="application\/json">([\s\S]*?)<\/script>/);return !!(m&&/"remote":\s*true/.test(m[1]))}catch(e){return false}}
function splitExam(text,aid){
 const m=text.match(/(<script id="exam-data" type="application\/json">)([\s\S]*?)(<\/script>)/);
 if(!m||!m[2].trim())return null;
 let ex;try{ex=JSON.parse(m[2])}catch(e){return null}
 if(!ex||!Array.isArray(ex.sections))return null;
 const key=JSON.parse(JSON.stringify(ex));
 ex.remote=true;ex.aid=aid;
 ex.sections.forEach(s=>s.questions.forEach(q=>{
  switch(q.type){
   case"mcq":case"tf":delete q.answer;break;
   case"multi":case"fill":delete q.answers;break;
   case"match":q.rights=[...new Set(q.pairs.map(p=>p[1]))].sort();q.pairs=q.pairs.map(p=>[p[0],""]);break;
   case"order":delete q.correct;break;
   case"sort":q.items=q.items.map(x=>({t:x.t}));break;
   case"convert":case"binadd":break;
   default:delete q.answer;delete q.tol;delete q.exact}}));
 const pub=text.replace(m[0],()=>m[1]+JSON.stringify(ex).replace(/</g,"\\u003c")+m[3]);
 return{pub,key}}

async function syncDb(){
 const prev=_snap,next=_db;let fail=false;
 const bad=r=>{if(!r.ok){fail=true;if(r.status===401||r.status===403)ss_set("ca_err","auth")}return r.ok};
 const pm=new Map(prev.a.map(a=>[a.id,a]));
 for(const a of next.a){
  const old=pm.get(a.id),m=metaOf(a),sig=urlSig(a);
  const metaChanged=!old||JSON.stringify(metaOf(old))!==JSON.stringify(m)&&true;
  const newContent=a.kind!=="link"&&a.url&&(!old||old._u!==sig)&&!(old&&a.kind==="html"&&isPubBody(a.url));
  if(newContent){
   let body=null,path=null;
   if(a.kind==="html"){
    const text=dataToText(a.url),sp=splitExam(text,a.id);
    if(sp){body=sp.pub;if(!bad(await sb("/rest/v1/exam_keys?on_conflict=aid",{method:"POST",body:JSON.stringify({aid:a.id,data:sp.key}),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}})))continue}
    else{body=text;await sb("/rest/v1/exam_keys?aid=eq."+enc(a.id),{method:"DELETE"})}
   }else{
    const ext=(a.file||"").split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"")||"bin";
    path=a.id+"-"+Math.random().toString(36).slice(2,10)+"."+ext;
    const up=await sb("/storage/v1/object/assessment-files/"+path,{method:"POST",body:dataToBlob(a.url,a.kind),headers:{"Content-Type":MIME[a.kind]||"application/octet-stream","x-upsert":"true"}});
    if(!bad(up))continue;
   }
   const o=await rows("assessments","id=eq."+enc(a.id)+"&select=path");
   if(!bad(await sb("/rest/v1/assessments?on_conflict=id",{method:"POST",body:JSON.stringify({id:a.id,meta:m,body,path}),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}})))continue;
   const oldp=o.ok&&o.j&&o.j[0]&&o.j[0].path;if(oldp&&oldp!==path)sb("/storage/v1/object/assessment-files/"+oldp,{method:"DELETE"})
  }else if(a.kind==="link"&&(!old||metaChanged||old._u!==sig)){
   bad(await sb("/rest/v1/assessments?on_conflict=id",{method:"POST",body:JSON.stringify({id:a.id,meta:m}),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}}))
  }else if(old&&JSON.stringify(metaOf(old))!==JSON.stringify(m)){
   bad(await sb("/rest/v1/assessments?id=eq."+enc(a.id),{method:"PATCH",body:JSON.stringify({meta:m}),headers:{Prefer:"return=minimal"}}))
  }}
 const ids=new Set(next.a.map(a=>a.id));
 for(const o of prev.a)if(!ids.has(o.id)){
  const p=await rows("assessments","id=eq."+enc(o.id)+"&select=path");
  bad(await sb("/rest/v1/assessments?id=eq."+enc(o.id),{method:"DELETE"}));
  await sb("/rest/v1/exam_keys?aid=eq."+enc(o.id),{method:"DELETE"});
  const pp=p.ok&&p.j&&p.j[0]&&p.j[0].path;if(pp)sb("/storage/v1/object/assessment-files/"+pp,{method:"DELETE"})}
 for(const y of new Set([...Object.keys(prev.pw),...Object.keys(next.pw)])){
  const nv=next.pw[y],pv=prev.pw[y];
  if(nv&&nv!==true&&nv!==pv)bad(await rpc("set_class_pw",{p_year:+y,p_hash:nv}));
  else if(!nv&&pv)bad(await rpc("clear_class_pw",{p_year:+y}))}
 if(JSON.stringify(prev.links)!==JSON.stringify(next.links))
  bad(await sb("/rest/v1/settings?on_conflict=key",{method:"POST",body:JSON.stringify({key:"links",value:next.links}),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}}));
 if(fail)throw new Error("sync");
 _snap=lite(next)}

/* Live exam monitoring (students send a heartbeat; teachers read) */
const LiveRemote=(()=>{
 const L={},P={},T={},FL={};let lastList=0,listCache=[];
 const flush=async sid=>{if(FL[sid])return;const p=P[sid]||{};delete P[sid];T[sid]=Date.now();FL[sid]=1;
  const r=await rpc("live_patch",{p_sid:sid,p});delete FL[sid];
  if(r.ok&&r.j){Object.assign(L[sid]=L[sid]||{sid},r.j)}else P[sid]=Object.assign(p,P[sid]||{})};
 return{
  async patch(sid,p){const prev=L[sid]||{},o=L[sid]=Object.assign(prev,p);P[sid]=Object.assign(P[sid]||{},p);
   const h=JSON.stringify(o.help||null);
   const urgent=!T[sid]||("state"in p&&p.state!==prev._st)||("help"in p&&h!==prev._h)||"ackN"in p;o._st=o.state;o._h=h;
   if(urgent||Date.now()-T[sid]>HEARTBEAT_MS)await flush(sid);return o},
  async get(sid){if(!L[sid]){const r=await rpc("live_get",{p_sid:sid});if(r.ok&&r.j)L[sid]=r.j}return L[sid]||null},
  async list(){if(Date.now()-lastList>4500){lastList=Date.now();const r=await rpc("live_list");if(r.ok&&r.j)listCache=r.j.list||[]}
   const n=Date.now();return listCache.filter(s=>n-(s.hb||0)<12*36e5)},
  async command(sid,cmd){await rpc("live_command",{p_sid:sid,p_cmd:cmd});lastList=0},
  async message(sid,m){await rpc("live_message",{p_sid:sid,p_level:m.level,p_text:m.text});lastList=0},
  async remove(sid){await rpc("live_remove",{p_sid:sid});lastList=0;listCache=listCache.filter(s=>s.sid!==sid)}
 }})();

 const c=catOf(a.cat),back=preview?"#/staff":`#/class/${a.year}/${a.cat}`;let body="";
 if(a.kind==="link")body=`<div class="panel"><p>This assessment is an online form.</p><a class="btn" target="_blank" rel="noopener" href="${esc(a.url)}">Open form</a></div>`;
 else if(a.kind==="html")body=`<iframe class="viewer" id="pv" sandbox="allow-scripts allow-forms allow-modals allow-same-origin" title="${esc(a.title)}"></iframe>`;
 else if(a.kind==="pdf")body=`<iframe class="viewer" id="pv" title="${esc(a.title)}"></iframe><div class="row"><button class="btn sm alt" data-save="1">Save PDF</button></div>`;
 else if(["jpg","png"].includes(a.kind))body=`<img class="viewer img" src="${a.url}" alt="${esc(a.title)}">`;
 else body=`<div class="panel"><p>Open this file in Microsoft Word or another document app.</p><button class="btn" data-save="1">Save ${esc(a.file)}</button></div>`;
 return crumb([["Home","#/"],preview?["Staff dashboard",back]:["Year "+a.year,"#/class/"+a.year],preview?[esc(a.title)]:[c.n,back],...(preview?[]:[[esc(a.title)]])])+`<div class="ph"><h1>${esc(a.title)}</h1><div class="rule"></div>${a.desc?`<p>${esc(a.desc)}</p>`:""}</div>${body}<div class="row"><a class="btn alt sm" href="${back}">Back</a></div>`}
let _u=null;
function afterView(a){const f=$("#pv");
 if(f&&a.kind==="html")f.srcdoc=injectLogo(dataToText(a.url));
 if(f&&a.kind==="pdf"){if(_u)URL.revokeObjectURL(_u);_u=URL.createObjectURL(dataToBlob(a.url,"pdf"));f.src=_u}
 $$("[data-save]").forEach(b=>b.onclick=()=>saveFile(a))}
function classroom(){return crumb([["Home","#/"],["Google Classroom"]])+`<div class="ph"><h1>GOOGLE CLASSROOM</h1><div class="rule"></div><p>Class resources and links shared by your teachers.</p></div>`+(db.links.length?`<div class="grid">${db.links.map(l=>`<a class="card" target="_blank" rel="noopener" href="${esc(l.url)}"><h3>${esc(l.title)}</h3><p>Open in Google Classroom</p></a>`).join("")}</div>`:`<div class="empty">No Classroom links have been added yet.</div>`)}

/* ===== Secure exam mode ===== */
let EX=null;
const readSess=id=>{try{return JSON.parse(localStorage.getItem("ca_sess_"+id))}catch(e){return null}};
const writeSess=(id,s)=>{try{localStorage.setItem("ca_sess_"+id,JSON.stringify(s))}catch(e){}};
function pendingExam(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith("ca_sess_")){const id=k.slice(8),s=readSess(id);if(s&&!s.done&&db.a.some(a=>a.id===id&&a.kind==="html"&&a.secure!==false))return{id,s}}}}catch(e){}return null}
function examGate(a){
 const s=subjOf(a.year),c=catOf(a.cat),ss=readSess(a.id),res=!!(ss&&!ss.done);

${res?'<div class="msg">Your exam is still open. Resume it to continue. Leaving the exam page was recorded and your teacher has been told.</div>':""}
<h2 style="margin-top:24px;font-size:1.4rem">Before you begin</h2>
<ul class="rules"><li>The exam fills your whole screen and stays there until you submit it.</li><li>You cannot go back, open other tabs or leave full screen. Every attempt is recorded and your teacher sees it.</li><li>If you must leave the room or something goes wrong, press <b>Ask teacher for help</b>. Your teacher decides what happens next.</li><li>When you submit the exam, the screen returns to normal.</li></ul>
<label for="exn">Full name</label><input id="exn" list="exl" value="${esc(nm)}" autocomplete="off"${res?" readonly":""}><datalist id="exl"></datalist><div id="exe"></div>
<div class="row"><button class="btn" id="exb">${res?"Resume exam":"Begin exam"}</button>${res?"":`<a class="btn alt" href="#/class/${a.year}/${a.cat}">Back</a>`}</div></div>`}
function bindExamGate(a){const bad=m=>{$("#exe").innerHTML='<div class="msg bad">'+m+'</div>'};
 let tm;$("#exn").addEventListener("input",()=>{if(!REMOTE)return;clearTimeout(tm);tm=setTimeout(async()=>{const v=$("#exn").value.trim();if(v.length<3)return;const r=await rpc("find_students",{p_q:v,p_year:+a.year});if(r.ok&&Array.isArray(r.j))$("#exl").innerHTML=r.j.map(x=>`<option value="${esc(x.name)}">${esc(x.cls)}</option>`).join("")},250)});
 $("#exb").onclick=async()=>{let n=$("#exn").value.trim();if(!n){bad("Enter your full name to begin.");return}
  if(REMOTE&&!isStaff()&&!$("#exn").readOnly){const r=await rpc("check_student",{p_name:n,p_year:+a.year});if(r.ok&&r.j&&r.j.ok){n=r.j.name;window.__stuCls=r.j.cls||""}else{bad("Your name is not on the Year "+a.year+" class list. Pick it from the suggestions, or ask your teacher.");return}}
  beginExam(a,n)}}
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
async function enterFS(){
 const el=EX.el,r=el.requestFullscreen||el.webkitRequestFullscreen;
 if(!r){EX.fsOK=false;return}
 try{await r.call(el);EX.fsOK=true;try{navigator.keyboard&&navigator.keyboard.lock&&navigator.keyboard.lock(["Escape"]).catch(()=>{})}catch(e){}}catch(e){EX.fsOK=false}
}
function leaveFS(){try{navigator.keyboard&&navigator.keyboard.unlock&&navigator.keyboard.unlock()}catch(e){}
 const x=document.exitFullscreen||document.webkitExitFullscreen;if(fsEl()&&x){try{const p=x.call(document);p&&p.catch&&p.catch(()=>{})}catch(e){}}}
function exToast(m){const t=$("#extoast");if(!t)return;t.textContent=m;t.hidden=false;clearTimeout(EX&&EX.tt);if(EX)EX.tt=setTimeout(()=>{t.hidden=true},5000)}
const editable=t=>t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable);
function onKey(e){
 if(!EX||EX.released)return;
 const k=(e.key||"").toLowerCase(),m=e.ctrlKey||e.metaKey;
 const bad=["f12","f5","f11"].includes(k)||(m&&["u","s","p","r","w","t","n","l"].includes(k))||(m&&e.shiftKey&&["i","j","c","k","n","t"].includes(k))||(e.altKey&&["arrowleft","arrowright"].includes(k))||(k==="backspace"&&!editable(e.target));
 if(bad){e.preventDefault();e.stopPropagation();note("keys","Blocked key: "+e.key);exToast("That key is disabled during the exam.")}
}
function onBlock(e){if(!EX||EX.released)return;e.preventDefault();note(e.type,e.type==="contextmenu"?"Right-click blocked":"Blocked "+e.type)}
function guard(doc){if(!doc)return;try{doc.addEventListener("keydown",onKey,true);["contextmenu","copy","cut","paste","dragstart"].forEach(t=>doc.addEventListener(t,onBlock,true))}catch(e){}}
function note(kind,msg){if(!EX||EX.released||EX.state==="paused")return;EX.viol.push({t:Date.now(),kind,msg});updBar();Live.patch(EX.sid,{viol:EX.viol.slice(-25),hb:Date.now()})}
function violate(kind,msg,cover=true){
 if(!EX||EX.released||EX.state==="paused")return;
 note(kind,msg);
 if(kind==="tab"){try{if(typeof $("#exfr").contentWindow.violation==="function")return}catch(e){}}   // the exam shows its own warning
 if(cover)showCover("violation",msg)}
function tone(l){try{const c=EX&&EX.ac;if(!c)return;if(c.state==="suspended")c.resume();const n=l==="final"?3:l==="warning"?2:1,f=l==="final"?740:l==="warning"?620:523;let t=c.currentTime;
 for(let i=0;i<n;i++){const o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.38);t+=.45}}catch(e){}}
function showNotice(m){
 if(!m||!EX)return;
 const el=$("#exmsg"),T={notice:["Invigilator notice","Message from your invigilator",""],warning:["Formal warning","You have received a formal warning","w"],final:["Final warning","This is your final warning","f"]}[m.level]||["Invigilator notice","Message from your invigilator",""];
 const tm=new Date(m.t||Date.now()).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
 el.innerHTML=`<div class="nt ${T[2]}" role="alertdialog" aria-modal="true" aria-labelledby="nt-t" aria-describedby="nt-m"><div class="nt-h"><span class="plate"><img src="${LOGO}" alt=""></span><div><div class="nt-k">${T[0]}</div><div class="nt-s">Al Muntazir Islamic International School</div></div></div>
<div class="nt-b"><h2 id="nt-t">${T[1]}</h2><p id="nt-m" class="nt-m">${esc(m.text)}</p>${m.w?`<p class="nt-w">Formal warnings on record: ${m.w}</p>`:""}<p class="nt-f">Sent by your invigilator at ${tm}. This message is recorded. Your exam time is still running.</p><div class="row"><button class="btn" id="nta">I understand</button></div></div></div>`;
 el.hidden=false;tone(m.level);$("#nta").focus();
 $("#nta").onclick=()=>{el.hidden=true;if(!EX)return;Live.patch(EX.sid,{ackN:m.n,ackT:Date.now(),hb:Date.now()});if(!EX.released&&EX.fsOK&&!fsEl()&&EX.state!=="paused")enterFS()}}
function updBar(){
 if(!EX||!EX.el)return;const st=$("#ex-st"),n=EX.viol.length;let t="In progress",c="ex-st";
 if(EX.released){t=EX.state==="done"?"Submitted":"Exam ended";c+=" ok"}
 else if(EX.state==="help"){t="Help requested. Waiting for your teacher.";c+=" bad"}
 else if(EX.state==="paused"){t="Paused by teacher";c+=" bad"}
 else if(n){t=`In progress · ${n} warning${n>1?"s":""}`}
 if(!EX.fsOK&&!EX.released)t+=" · full screen unavailable";
 st.textContent=t;st.className=c;
 $("#ex-help").textContent=EX.state==="help"?"Cancel help request":"Ask teacher for help";
 $("#ex-help").hidden=EX.released||EX.state==="paused";
 const x=$("#ex-exit");x.disabled=!EX.released;x.textContent=EX.released?"Back to portal":"Submit the exam to leave";
}
function showCover(kind,msg){
 const cv=$("#excv");let h="";
 if(kind==="violation")h=`<div class="cv"><h2>Return to your exam</h2><p>${esc(msg)}. This was recorded and your teacher has been told.</p><button class="btn" id="cvb">Return to exam</button></div>`;
 else if(kind==="paused")h=`<div class="cv"><h2>Exam paused by your teacher</h2><p>You may leave now. Your teacher will resume the exam when you are back. Do not close this page.</p></div>`;
 else if(kind==="resume")h=`<div class="cv"><h2>Your teacher has resumed the exam</h2><p>Press the button to return to full screen and continue.</p><button class="btn" id="cvb">Return to exam</button></div>`;
 cv.innerHTML=h;cv.hidden=false;
 const b=$("#cvb");if(b)b.onclick=async()=>{if(!fsEl())await enterFS();cv.hidden=true;updBar()};
}
function exDone(){
 try{const w=$("#exfr").contentWindow;
  if(w.__examDone===true)return true;
  if(typeof w.isSubmitted==="function"&&w.isSubmitted())return true;
  const r=w.document.getElementById("results-screen");if(r&&r.classList.contains("active"))return true}catch(e){}
 return false}
function release(why){
 if(!EX||EX.released)return;
 EX.released=true;EX.state=why==="submitted"?"done":"ended";
 leaveFS();$("#excv").hidden=true;$("#exhm").hidden=true;$("#exmsg").hidden=true;
 (EX.off||[]).forEach(f=>f());
 const ss=readSess(EX.a.id);if(ss){ss.done=true;writeSess(EX.a.id,ss)}
 Live.patch(EX.sid,{state:EX.state,help:null,viol:EX.viol.slice(-25),hb:Date.now()});
 updBar();
 exToast(why==="submitted"?"Exam submitted. You can leave now.":why==="time"?"Time is up. You can leave now.":"Your teacher ended the exam. You can leave now.");
}
function applyCmd(c){
 if(!EX||EX.released)return;
 if(c==="allow"){EX.state="paused";EX.help=null;leaveFS();$("#exhm").hidden=true;showCover("paused");updBar()}
 else if(c==="resume"){if(EX.state==="paused"){EX.state="active";showCover("resume");updBar()}}
 else if(c==="deny"){EX.help=null;EX.state="active";updBar();exToast("Your teacher asked you to keep going with the exam.")}
 else if(c==="end"){release("teacher")}
}
let _tk=0;
async function exTick(){
 if(!EX)return;
 const s=await Live.get(EX.sid);
 if(s&&(s.cmdN||0)>EX.ack){EX.ack=s.cmdN;applyCmd(s.cmd)}
 if(s&&!EX.released&&(s.msgN||0)>(EX.msgSeen||0)){EX.msgSeen=s.msgN;showNotice(s.msg)}
 if(!EX.released){
  if(exDone())release("submitted");
  else if(EX.limit&&Date.now()-EX.t0>(EX.limit+2)*60000)release("time");
 }
 if(++_tk%2===0&&EX&&!EX.released)Live.patch(EX.sid,{hb:Date.now(),state:EX.state,help:EX.help,viol:EX.viol.slice(-25)});
}
function closeShell(){
 if(!EX)return;clearInterval(EX.iv);(EX.off||[]).forEach(f=>f());EX.el.remove();document.body.classList.remove("exam-on");leaveFS();EX=null}
async function beginExam(a,name){
 try{sessionStorage.setItem("ca_name",name)}catch(e){}
 let ss=readSess(a.id);const resuming=!!(ss&&!ss.done&&ss.name.toLowerCase()===name.toLowerCase());
 if(!resuming){ss={sid:a.id+"-"+Date.now().toString(36),name,t0:Date.now(),done:false};writeSess(a.id,ss)}
 const el=document.createElement("div");el.id="ex";el.className="ex";
 el.innerHTML=`<div class="ex-bar"><span class="plate"><img src="${LOGO}" alt=""></span><div class="ex-t">${esc(a.title)}</div><span class="ex-st" id="ex-st"></span><button class="btn sm ghost" id="ex-help">Ask teacher for help</button><button class="btn sm" id="ex-exit" disabled>Submit the exam to leave</button></div>
<div class="ex-body"><iframe id="exfr" title="${esc(a.title)}" sandbox="allow-scripts allow-forms allow-modals allow-same-origin"></iframe><div class="cover" id="excv" hidden></div><div class="cover" id="exhm" hidden></div></div><div class="cover" id="exmsg" hidden></div><div class="toast" id="extoast" hidden></div>`;
 document.body.appendChild(el);document.body.classList.add("exam-on");
 EX={a,el,sid:ss.sid,name:ss.name,t0:ss.t0,limit:+a.limit||0,state:"active",viol:[],help:null,ack:0,hash:location.hash,released:false,fsOK:true,off:[],msgSeen:0};
 try{EX.ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
 const fsP=enterFS();   // called inside the click so the browser accepts it
 const cur=await Live.get(EX.sid);if(cur){EX.viol=cur.viol||[];EX.ack=cur.cmdN||0;EX.msgSeen=cur.ackN||0}
 await fsP;
 const fr=$("#exfr");fr.addEventListener("load",()=>guard(fr.contentDocument));
 fr.srcdoc=injectLogo(dataToText(a.url));
 // listeners (all removed on release)
 const add=(t,ev,f,o)=>{t.addEventListener(ev,f,o);EX.off.push(()=>t.removeEventListener(ev,f,o))};
 add(document,"keydown",onKey,true);
 ["contextmenu","copy","cut","paste","dragstart"].forEach(t=>add(document,t,onBlock,true));
 add(document,"visibilitychange",()=>{if(document.hidden)violate("tab","You switched away from the exam")});
 const fsch=()=>{if(EX&&!EX.released&&EX.fsOK&&EX.state!=="paused"&&!fsEl())violate("fullscreen","You left full screen")};
 add(document,"fullscreenchange",fsch);add(document,"webkitfullscreenchange",fsch);
 add(window,"beforeunload",e=>{e.preventDefault();e.returnValue="";});
 history.pushState({ex:1},"",EX.hash);history.pushState({ex:1},"",EX.hash);
 add(window,"popstate",()=>{history.pushState({ex:1},"",EX.hash);note("back","Tried to go back");exToast("Going back is disabled during the exam.")});
 add(window,"message",e=>{if(EX&&e.source===fr.contentWindow&&e.data&&e.data.type==="exam-submitted")release("submitted")});
 $("#ex-help").onclick=()=>{if(EX.state==="help"){EX.state="active";EX.help=null;Live.patch(EX.sid,{state:"active",help:null,hb:Date.now()});updBar()}else openHelp()};
 $("#ex-exit").onclick=()=>{if(!EX||!EX.released)return;const a2=EX.a;closeShell();location.hash=`#/class/${a2.year}/${a2.cat}`;route()};
 if(resuming)note("reload","Exam page was reopened or reloaded");
 EX.iv=setInterval(exTick,1000);
 Live.patch(EX.sid,{sid:EX.sid,aid:a.id,title:a.title,year:a.year,name:EX.name,state:"active",hb:Date.now(),viol:EX.viol.slice(-25),help:null});
 updBar();exTick();
}
function openHelp(){

 const R=[["Emergency. I need to leave the room."],["I need the toilet."],["Computer or exam problem."],["I have a question for my teacher."]];
 hm.innerHTML=`<div class="hm" role="dialog" aria-labelledby="hmt"><h2 id="hmt">Ask your teacher for help</h2><p class="note">Use this for emergencies and real problems. Your teacher is told right away and decides what happens next.</p>
<fieldset><legend>What do you need?</legend>${R.map((r,i)=>`<label class="chk" for="hr${i}"><input type="radio" name="hr" id="hr${i}" value="${r[0]}"${i===0?" checked":""}>${r[0]}</label>`).join("")}</fieldset>

<div class="row"><button class="btn" id="hs">Send request</button><button class="btn alt" id="hc">Cancel</button></div></div>`;

function persist(m){if(!API.save(db))flash='<b>Not saved.</b> The file is too large for browser storage. Use a smaller file or connect the backend.';else flash=m;route()}
function bindDash(){
 $("#fs").onclick=async()=>{const t=$("#ft").value.trim(),f=$("#ff").files[0],l=$("#fl").value.trim();if(!t){flash="Add a title first.";return route()}
  const old=db.a.find(a=>a.id===editId);let rec=old?{...old}:{id:"a"+Date.now().toString(36),date:new Date().toISOString().slice(0,10)};
  Object.assign(rec,{year:+$("#fy").value,cat:$("#fc").value,title:t,desc:$("#fd").value.trim(),secure:$("#fsec").checked,limit:Math.max(0,+$("#flim").value||0)});
  if(f){rec.url=await readFile(f);rec.file=f.name;rec.kind=kindOf(f.name)}else if(l){rec.url=l;rec.kind="link";rec.file=""}else if(!old){flash="Choose a file or enter a form link.";return route()}
  if(rec.kind==="file"){flash="That file type is not supported. Use HTML, PDF, Word, JPG or PNG.";return route()}
  db.a=old?db.a.map(a=>a.id===editId?rec:a):[...db.a,rec];const m=editId?"Changes saved.":"Assessment uploaded.";editId=null;DT="assessments";persist(m)};
 if($("#fx"))$("#fx").onclick=()=>{editId=null;flash="";route()};
 $$("[data-e]").forEach(b=>b.onclick=()=>{editId=b.dataset.e;DT="upload";flash="";route();scrollTo(0,0)});
 $$("[data-d]").forEach(b=>b.onclick=()=>{if(b.dataset.armed){db.a=db.a.filter(a=>a.id!==b.dataset.d);persist("Assessment deleted.")}else{b.dataset.armed="1";b.textContent="Confirm delete";setTimeout(()=>{b.dataset.armed="";b.textContent="Delete"},4000)}});
 $("#pws").onclick=async()=>{for(const s of SUBJECTS)for(const y of s.years){const v=$("#pw"+y).value;if(v)db.pw[y]=await sha(v)}persist("Passwords saved.")};
 $$("[data-rp]").forEach(b=>b.onclick=()=>{delete db.pw[b.dataset.rp];persist("Password protection removed for Year "+b.dataset.rp+".")});
 $$("[data-l]").forEach(b=>b.onclick=()=>{db.links.splice(+b.dataset.l,1);persist("Link removed.")});
 $("#lb").onclick=()=>{const t=$("#lt").value.trim(),u=$("#lu").value.trim();if(t&&u){db.links.push({title:t,url:u});persist("Link added.")}};
 $("#lo").onclick=()=>{sessionStorage.removeItem("ca_staff");sessionStorage.removeItem("ca_role");flash="";route()};
 const lv=$("#live");
 lv.onclick=async e=>{
  const sb=e.target.closest("[data-send]");
  if(sb){const k=sb.dataset.send,m=msgOf(k);if(!m.text){toast("Write your message first.");return}
   const ACT=["active","help","paused"],L=await Live.list(),T=k==="ALL"?L.filter(s=>ACT.includes(s.state)):L.filter(s=>s.sid===k&&ACT.includes(s.state));
   if(!T.length){toast("That student is no longer in an exam.");return}
   for(const s of T)await Live.message(s.sid,m);
   if(dr(k).p==="custom")dr(k).t="";
   toast(`${LV[m.level]} sent to ${k==="ALL"?T.length+" students":T[0].name}.`);liveSig="";refreshLive(await Live.list());return}
  const b=e.target.closest("[data-lc]");if(!b)return;const sid=b.dataset.sid,c=b.dataset.lc;
  if(c==="clear")await Live.remove(sid);else await Live.command(sid,c);liveSig="";refreshLive(await Live.list())};
 const cmpChange=e=>{const t=e.target,k=t.dataset&&t.dataset.ck;if(!k)return;const d=dr(k);d[t.dataset.f]=t.value;
  if(t.dataset.f==="p"){const cc=document.getElementById("cc-"+k);if(cc)cc.hidden=d.p!=="custom"}
  const pv=document.getElementById("cv-"+k);if(pv)pv.textContent=d.p==="custom"?"":msgOf(k).text};
 lv.addEventListener("input",cmpChange);lv.addEventListener("change",cmpChange);
 lv.addEventListener("toggle",e=>{const d=e.target;if(d&&d.dataset&&d.dataset.ok)dr(d.dataset.ok).o=d.open},true);
 liveSig="";Live.list().then(refreshLive)}
const STL={help:"Needs help",paused:"Paused",active:"In exam",done:"Submitted",ended:"Ended by teacher"};
const LV={notice:"Notice",warning:"Warning",final:"Final warning"};
const MSGS=[
 {k:"silence",lv:"notice",name:"Silence in the examination room",text:"Silence is required in the examination room. Please continue working quietly and independently."},
 {k:"eyes",lv:"warning",name:"Keep your eyes on your own screen",text:"Please keep your eyes on your own screen. Looking at another candidate's work is not permitted."},
 {k:"talk",lv:"warning",name:"Stop talking",text:"This is a formal warning. Talking or communicating with other candidates is not permitted during the examination. Please stop immediately."},
 {k:"device",lv:"warning",name:"Unauthorised devices or materials",text:"Unauthorised devices and materials are not permitted in this examination. Put them away now."},
 {k:"focus",lv:"warning",name:"Stay on the exam page",text:"Activity outside the exam page has been recorded. Remain on the exam page for the rest of the examination."},
 {k:"final",lv:"final",name:"Final warning: exam may be ended",text:"This is your final warning. If this continues, your examination will be ended immediately."},
 {k:"time",lv:"notice",name:"Time reminder",text:"Please check the time. Review your answers and submit before time runs out."},
 {k:"custom",lv:null,name:"Write my own message",text:""}];
const DRAFT={};
const dr=k=>DRAFT[k]||(DRAFT[k]={p:"silence",l:"warning",t:"",o:false});
function msgOf(k){const d=dr(k);if(d.p==="custom")return{level:d.l,text:d.t.trim()};const m=MSGS.find(x=>x.k===d.p)||MSGS[0];return{level:m.lv,text:m.text}}
function compose(k,to){const d=dr(k),cu=d.p==="custom",id=esc(k);
 return `<div class="cmp"><label for="cp-${id}">Message</label><select id="cp-${id}" data-ck="${id}" data-f="p">${MSGS.map(m=>`<option value="${m.k}"${m.k===d.p?" selected":""}>${m.lv?LV[m.lv]+": ":""}${esc(m.name)}</option>`).join("")}</select>
<div id="cc-${id}"${cu?"":" hidden"}><label for="cl-${id}">Level</label><select id="cl-${id}" data-ck="${id}" data-f="l">${Object.keys(LV).map(x=>`<option value="${x}"${d.l===x?" selected":""}>${LV[x]}</option>`).join("")}</select><label for="ct-${id}">Your message</label><textarea id="ct-${id}" data-ck="${id}" data-f="t" rows="2" maxlength="240">${esc(d.t)}</textarea></div>
<p class="cmp-p" id="cv-${id}">${cu?"":esc(msgOf(k).text)}</p>
<div class="row" style="margin-top:8px"><button class="btn sm" data-send="${id}">Send to ${esc(to)}</button></div></div>`}
function ago(t){const s=Math.round((Date.now()-t)/1000);return s<60?s+"s ago":Math.round(s/60)+" min ago"}
function refreshLive(L){
 const box=$("#live");if(!box)return;
 const n=Date.now(),ACT=["active","help","paused"];L=L.slice().sort((a,b)=>(b.state==="help")-(a.state==="help")||String(a.name).localeCompare(b.name));
 const sig=JSON.stringify(L.map(s=>({...s,hb:n-(s.hb||0)>15000})));
 const nh=L.filter(s=>s.state==="help").length,bd=$("#lvbadge");if(bd){bd.hidden=!nh;bd.textContent=nh}{const tb=$("#tbadge");if(tb){tb.hidden=!nh;tb.textContent=nh}const a=$("#tlive");if(a)a.textContent=L.filter(s=>ACT.includes(s.state)).length;const h=$("#thelp");if(h)h.textContent=nh}
 if(sig===liveSig)return;
 const ae=document.activeElement;if(ae&&box.contains(ae)&&/^(TEXTAREA|SELECT)$/.test(ae.tagName))return;   // do not redraw while the teacher is choosing or typing
 liveSig=sig;
 if(!L.length){box.innerHTML='<div class="empty">No students are in an exam right now. They appear here when they begin a secure exam.</div>';return}
 const act=L.filter(s=>ACT.includes(s.state));
 const all=act.length>1?`<details class="lv all" data-ok="ALL"${dr("ALL").o?" open":""}><summary><b>Message all students in exams (${act.length})</b></summary>${compose("ALL","all "+act.length+" students")}</details>`:"";
 box.innerHTML=all+L.map(s=>{const off=ACT.includes(s.state)&&n-(s.hb||0)>15000,v=s.viol||[],sid=esc(s.sid),live=ACT.includes(s.state);
  let btn="";
  if(s.state==="help")btn=`<button class="btn sm" data-lc="allow" data-sid="${sid}">Pause exam and allow leave</button><button class="btn sm alt" data-lc="deny" data-sid="${sid}">Not now</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
  else if(s.state==="active")btn=`<button class="btn sm alt" data-lc="allow" data-sid="${sid}">Pause and allow leave</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
  else if(s.state==="paused")btn=`<button class="btn sm" data-lc="resume" data-sid="${sid}">Resume exam</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
  else btn=`<button class="btn sm alt" data-lc="clear" data-sid="${sid}">Remove from list</button>`;
  const acked=(s.ackN||0)>=(s.msgN||0),ms=s.msgs||[];
  return `<div class="lv ${esc(s.state)}"><div class="lv-h"><strong>${esc(s.name)}</strong><span class="tag">Year ${esc(s.year)}</span><span>${esc(s.title)}</span><span class="tag ${s.state==="help"?"bad":s.state==="done"||s.state==="ended"?"ok":""}">${STL[s.state]||esc(s.state)}</span>${off?'<span class="tag bad">No signal</span>':""}${v.length?`<span class="tag bad">${v.length} warning${v.length>1?"s":""}</span>`:""}${s.warns?`<span class="tag bad">${s.warns} formal warning${s.warns>1?"s":""} issued</span>`:""}</div>
${s.state==="help"&&s.help?`<p class="lv-r"><b>${esc(s.help.reason)}</b>${s.help.note?" “"+esc(s.help.note)+"”":""}</p>`:""}
${v.length?`<details><summary>Activity log</summary><ul>${v.slice(-8).reverse().map(x=>`<li>${new Date(x.t).toLocaleTimeString("en-GB")} · ${esc(x.msg)}</li>`).join("")}</ul></details>`:""}
${ms.length?`<details><summary>Messages sent (${s.msgN}) · last one ${acked?"acknowledged"+(s.ackT?" at "+new Date(s.ackT).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):""):"waiting for the student to acknowledge"}</summary><ul>${ms.slice().reverse().map(x=>`<li>${new Date(x.t).toLocaleTimeString("en-GB")} · ${LV[x.level]||""}: ${esc(x.text)}</li>`).join("")}</ul></details>`:""}
${live?`<details data-ok="${sid}"${dr(s.sid).o?" open":""}><summary>Send a message to ${esc(s.name)}</summary>${compose(s.sid,s.name)}</details>`:""}
<div class="row">${btn}</div></div>`}).join("")}
const alerted=new Set();
function beep(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();let t=ac.currentTime;for(let i=0;i<3;i++){const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.32);t+=.4}}catch(e){}}
async function watchLive(){
 const nb=$("#navbadge");
 if(!isStaff()){nb.hidden=true;document.title="Computer Assessment Portal";return}
 const L=await Live.list(),h=L.filter(s=>s.state==="help");
 h.forEach(s=>{const k=s.sid+":"+(s.help&&s.help.t);if(!alerted.has(k)){alerted.add(k);beep();toast(`Help request from ${s.name}: ${s.help?s.help.reason:""}`)}});
 nb.hidden=!h.length;nb.textContent=h.length;
 document.title=h.length?`(${h.length}) Help request · Computer Assessment`:"Computer Assessment Portal";
 if($("#live"))refreshLive(L);
}

  const d=byId[q.id]||{e:0,g:"",c:""},full=q.marks!=null&&d.e>=q.marks-1e-9,part=!full&&d.e>0,col=full?[22,163,74]:part?[217,119,6]:[220,38,38];

<script id="up-js">
(function(){
const nz=s=>String(s||"").toUpperCase().replace(/\s+/g," ").trim();

const nat=(a,b)=>String(a).localeCompare(String(b),undefined,{numeric:true});
const gOf=(sex,cls)=>{const s=String(sex||"").toUpperCase();if(s==="M")return"Boys";if(s==="F")return"Girls";const m=String(cls||"").toUpperCase().match(/^\d+\s*([BG])/);return m?(m[1]==="B"?"Boys":"Girls"):"Unknown"};

/* ---------- 1. LIVE EXAMS: YEAR > BOYS/GIRLS > STREAM (Year 10: Boys/Girls > all students) ---------- */
function loadRM(){if(RM||RML||!REMOTE||!isStaff())return;RML=true;
 fetchAll("roster","select=name,cls,year,sex&order=id").then(d=>{RM={};(d||[]).forEach(r=>RM[nz(r.name)]=r)}).catch(()=>{RM={}}).then(()=>{RML=false;liveSig="";if($("#mgbody")&&MG.data[MG.tab])mgDraw()})}
const inf=s=>{const r=(RM&&RM[nz(s.name)])||{};return{y:+s.year||+r.year||0,g:gOf(r.sex,r.cls),c:r.cls||"Unassigned"}};
const clsOf=s=>inf(s).c;
const inScope=s=>{const i=inf(s);return(!LY||i.y===LY)&&(!LG||i.g===LG)&&(!LC||i.c===LC)};
const scopeLab=()=>[LY&&"Year "+LY,LG,LC].filter(Boolean).join(" › ")||"all";

function stuCard(s,n){
 const off=ACT.includes(s.state)&&n-(s.hb||0)>15000,v=s.viol||[],sid=esc(s.sid),live=ACT.includes(s.state),fin=DONE.includes(s.state);let btn="";
 if(s.state==="help")btn=`<button class="btn sm" data-lc="allow" data-sid="${sid}">Pause exam and allow leave</button><button class="btn sm alt" data-lc="deny" data-sid="${sid}">Not now</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
 else if(s.state==="active")btn=`<button class="btn sm alt" data-lc="allow" data-sid="${sid}">Pause and allow leave</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
 else if(s.state==="paused")btn=`<button class="btn sm" data-lc="resume" data-sid="${sid}">Resume exam</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
 else btn=`<button class="btn sm danger" data-ldel="${sid}">Delete student</button>`;
 const acked=(s.ackN||0)>=(s.msgN||0),ms=s.msgs||[];
 return `<div class="lv ${esc(s.state)}"><div class="lv-h"><input type="checkbox" data-lsel="${sid}" aria-label="Select"${LSEL.has(s.sid)?" checked":""}><strong>${esc(s.name)}</strong><span class="tag">${esc(clsOf(s))}</span><span>${esc(s.title)}</span><span class="tag ${s.state==="help"?"bad":fin?"ok":""}">${STL[s.state]||esc(s.state)}</span>${off?'<span class="tag bad">No signal</span>':""}${v.length?`<span class="tag bad">${v.length} warning${v.length>1?"s":""}</span>`:""}${s.warns?`<span class="tag bad">${s.warns} formal warning${s.warns>1?"s":""} issued</span>`:""}</div>
${s.state==="help"&&s.help?`<p class="lv-r"><b>${esc(s.help.reason)}</b>${s.help.note?" “"+esc(s.help.note)+"”":""}</p>`:""}
${v.length?`<details><summary>Activity log</summary><ul>${v.slice(-8).reverse().map(x=>`<li>${new Date(x.t).toLocaleTimeString("en-GB")} · ${esc(x.msg)}</li>`).join("")}</ul></details>`:""}
${ms.length?`<details><summary>Messages sent (${s.msgN}) · last one ${acked?"acknowledged":"waiting for the student"}</summary><ul>${ms.slice().reverse().map(x=>`<li>${new Date(x.t).toLocaleTimeString("en-GB")} · ${LV[x.level]||""}: ${esc(x.text)}</li>`).join("")}</ul></details>`:""}
${live?`<details data-ok="${sid}"${dr(s.sid).o?" open":""}><summary>Send a message to ${esc(s.name)}</summary>${compose(s.sid,s.name)}</details>`:""}
<div class="row">${btn}</div></div>`}

refreshLive=function(L){
 const box=$("#live");if(!box)return;loadRM();
 if(!box.__up){box.__up=1;box.addEventListener("click",liveClick,true)}
 const n=Date.now();
 L=L.filter(s=>{if(!HID[s.sid])return true;if(s.state==="help"){delete HID[s.sid];saveHid();return true}return false});
 L=L.slice().sort((a,b)=>(b.state==="help")-(a.state==="help")||String(a.name).localeCompare(b.name));
 const nh=L.filter(s=>s.state==="help").length,bd=$("#lvbadge");
 if(bd){bd.hidden=!nh;bd.textContent=nh}
 {const tb=$("#tbadge");if(tb){tb.hidden=!nh;tb.textContent=nh}const a=$("#tlive");if(a)a.textContent=L.filter(s=>ACT.includes(s.state)).length;const h=$("#thelp");if(h)h.textContent=nh}

 const card=(lab,arr,attr,val)=>{const a=arr.filter(s=>ACT.includes(s.state)).length,h=arr.filter(s=>s.state==="help").length,d=arr.filter(s=>DONE.includes(s.state)).length;
  return `<button class="card cc${h?" help":""}" ${attr}="${esc(val)}"><h3>${esc(lab)}<span class="big">${arr.length}</span></h3><p>${a} in exam${d?`, ${d} finished/ended`:""}</p><p style="margin-top:8px">${h?`<span class="tag bad">${h} help request${h>1?"s":""}</span>`:'<span class="tag ok">No alerts</span>'}</p></button>`};
 const depth=LC?3:LG?2:LY?1:0;
 let head="",body="",stu=null;

 if(!LY){const ys=[...new Set(L.map(s=>inf(s).y))].sort((a,b)=>a-b);
  body=`<p class="note">Choose a year.</p><div class="grid">${ys.map(y=>card("Year "+y,L.filter(s=>inf(s).y===y),"data-ny",y)).join("")}</div>`}
 else{const Y=L.filter(s=>inf(s).y===LY);
  if(!LG){const gs=["Boys","Girls","Unknown"].filter(g=>Y.some(s=>inf(s).g===g));
   body=`<p class="note">Choose Boys or Girls.</p><div class="grid">${gs.map(g=>card(g,Y.filter(s=>inf(s).g===g),"data-ng",g)).join("")}</div>`}
  else{const G=Y.filter(s=>inf(s).g===LG);
   if(LY===10||LC){stu=LG===undefined?[]:G.filter(s=>LY===10||inf(s).c===LC)}
   else{const cs=[...new Set(G.map(s=>inf(s).c))].sort(nat);
    body=`<p class="note">Choose a stream.</p><div class="grid">${cs.map(c=>card(c,G.filter(s=>inf(s).c===c),"data-nc",c)).join("")}</div>`}}}

 const msg=act.length>1?(!LY?`<details class="lv all" data-ok="ALL"${dr("ALL").o?" open":""}><summary><b>Message all students in exams (${act.length})</b></summary>${compose("ALL","all "+act.length+" students")}</details>`
  :`<details class="lv all" data-ok="CLASS"${dr("CLASS").o?" open":""}><summary><b>Message all in ${esc(scopeLab())} (${act.length})</b></summary>${compose("CLASS","all "+act.length+" students in "+scopeLab())}</details>`):"";
 let list="";
 if(stu){const fin=stu,selN=fin.filter(s=>LSEL.has(s.sid)).length;
  list=`<p class="note">${stu.length} student${stu.length===1?"":"s"}${LY===10?" (all Year 10 "+esc(LG)+", streams not separated)":""}.</p>`+
  (fin.length?`<div class="lvbar"><label class="chk" style="margin:0"><input type="checkbox" data-lselall="1"${selN&&selN===fin.length?" checked":""}>Select all (${fin.length})</label><button class="btn sm danger" data-ldelsel="1"${selN?"":" disabled"}>Delete selected (${selN})</button></div>`:"")+

async function delStudents(sids){
 const L=await Live.list(),S=L.filter(s=>sids.includes(s.sid)),act=S.filter(s=>ACT.includes(s.state)).length,nm=sids.length===1?((S[0]||{}).name||"this student"):sids.length+" students";

function endDialog(sid){

 const redraw=async()=>{liveSig="";refreshLive(await Live.list())};
 o.querySelector("#ed0").onclick=()=>o.remove();

const pc=(a,b)=>b?Math.round(a/b*100):0,stt=p=>p<50?["Re-teach","bad"]:p<70?["Revise","mid"]:["Secure","ok"];
const cut=(s,n)=>{s=strip(s);return s.length>n?s.slice(0,n)+"…":s};
async function analyse(list,btn){
 const old=btn.textContent;btn.disabled=true;
 try{
  const ids=list.map(r=>r.id),all=[];
  for(let i=0;i<ids.length;i+=40){btn.textContent="Loading "+Math.min(i+40,ids.length)+"/"+ids.length+"…";
   const r=await rows("results","id=in."+enc("("+ids.slice(i,i+40).join(",")+")")+"&select=*");if(!r.ok)throw new Error("Could not load results. Log in again.");all.push(...(r.j||[]))}
  const by={};all.forEach(r=>(by[r.aid]=by[r.aid]||[]).push(r));const reps=[];
  for(const aid of Object.keys(by)){
   const R=by[aid],key=await getKey(aid),D=R.filter(r=>Array.isArray(r.detail)&&r.detail.length);let Q=qList(key);
   if(!Q.length&&D.length)Q=D[0].detail.map((d,i)=>({id:d.id,n:i+1,si:0,sec:"",marks:0,prompt:"Question "+(i+1)}));
   const qs={};Q.forEach(q=>{if(!q.marks)q.marks=Math.max(1,...D.map(r=>{const d=r.detail.find(x=>x.id===q.id);return d?+d.e||0:0}));qs[q.id]={q,n:0,e:0,full:0,wr:{},cor:""}});
   D.forEach(r=>r.detail.forEach(d=>{const o=qs[d.id];if(!o)return;o.n++;o.e+=+d.e||0;if(d.c&&!o.cor)o.cor=d.c;
    if((+d.e||0)>=o.q.marks-1e-9)o.full++;else{const g=strip(d.g)||"No answer given";o.wr[g]=(o.wr[g]||0)+1}}));
   const items=Object.values(qs).filter(o=>o.n).map(o=>{const w=Object.entries(o.wr).sort((a,b)=>b[1]-a[1])[0];return{...o,pct:pc(o.e,o.q.marks*o.n),fp:pc(o.full,o.n),top:w?w[0]:"",topN:w?w[1]:0}});
   const S={};items.forEach(o=>{const k=o.q.si,s=S[k]=S[k]||{name:o.q.sec||"General",e:0,p:0,it:[]};s.e+=o.e;s.p+=o.q.marks*o.n;s.it.push(o)});
   const secs=Object.values(S).map(s=>({...s,pct:pc(s.e,s.p)})).sort((a,b)=>a.pct-b.pct);
   const dist={};R.forEach(r=>dist[r.grade]=(dist[r.grade]||0)+1);
   reps.push({title:R[0].title,N:R.length,mean:Math.round(R.reduce((t,r)=>t+(+r.pct||0),0)/R.length),pass:R.filter(r=>r.pct>=50).length,dist,items,secs,low:R.filter(r=>r.pct<50).sort((a,b)=>a.pct-b.pct),noD:R.length-D.length,cls:[...new Set(R.map(r=>r.cls))].join(", ")})}
  showReport(reps)}
 catch(e){toast(e.message||"Could not build the analysis.")}

<h3>Students who need support (below 50%)</h3>${R.low.length?`<p>${R.low.map(r=>sx(r.name)+" ("+sx(r.cls)+", "+r.pct+"%)").join("; ")}.</p>`:"<p>None. Every student passed.</p>"}${R.noD?`<p class="note">${R.noD} result(s) have no question details and are not in the question analysis.</p>`:""}`}).join("")}

const CP_SEC=/^(?:#+\s*)?(?:\*\*)?\s*SECTION\s+([A-Za-z0-9]+)\b\s*[:\-–—.]?\s*(.*?)\s*(?:\*\*)?\s*$/i;
const CP_MARKS=/questions?\s*(\d+)\s*[–\-—]+\s*(\d+)\W+(\d+(?:\.\d+)?)\s*marks?/i;
const CP_KEYHEAD=/^(?:#+\s*)?\**\s*(answer\s*key|answers|marking\s*scheme|mark\s*scheme)\b/i;
const CP_ANS=/^\s*(?:\*\*)?\s*(?:correct\s+)?answer\s*(?:\*\*)?\s*[:\-]\s*(?:\*\*)?\s*\(?([A-Ha-h])\)?\b/i;
const CP_Q=/^\s*(?:\*\*)?\s*(?:Q(?:uestion)?\s*)?(\d{1,3})\s*[.)]\s*(?:\*\*)?\s*(.*)$/i;
const CP_OPT=/^\s*(?:\*\*)?\(?([A-Ha-h])\s*[.)]\s*(?:\*\*)?\s*(.*)$/;
function parseComputing(raw,keyTxt){
 const errs=[],warns=[];
 const lines=String(raw||"").replace(/\r/g,"").replace(/[\u00a0\u200b]/g," ").split("\n");
 /* tokens: code fences become one token */
 const T=[];let fence=null;
 for(const ln of lines){
  if(/^\s*```/.test(ln)){if(fence===null)fence=[];else{T.push({code:fence});fence=null}continue}
  if(fence!==null){fence.push(ln.replace(/\s+$/,""));continue}
  T.push({s:ln.replace(/\s+$/,"")})}
 if(fence!==null){T.push({code:fence});warns.push("A code block was not closed with ``` . The rest of the text was treated as code.")}
 const strict=T.filter(t=>t.s!==undefined&&/^\s*\*\*\s*\d{1,3}\s*[.)]\s*\*\*/.test(t.s)).length>=3;
 const ex={id:"",title:"",subject:"Computing",level:"",topic:"",durationMinutes:null,sections:[]};
 let main="",sub="",declared=null,instr=[],inInstr=false,sec=null,q=null,expect=1,keyDoc={},inKey=false,keyLines=[],secMarks=null,started=false;
 const inline={};
 const closeQ=()=>{if(q&&sec){q.n=q.num;sec.qs.push(q)}q=null};
 const newSec=(L,rest)=>{closeQ();sec={name:"Section "+L.toUpperCase()+(rest?": "+cpTitle(rest):""),short:"Section "+L.toUpperCase(),qs:[],perQ:null,from:null,to:null};ex.sections.push(sec);inInstr=false;started=true;secMarks=null};
 /* no SECTION headings at all: begin at the first question that is followed by an A. option */
 const hasSec=T.some(t=>t.s!==undefined&&CP_SEC.test(t.s.trim()));
 let startIdx=0;
 if(!hasSec){for(let i=0;i<T.length;i++){const s=T[i].s;if(s===undefined)continue;const m=s.match(CP_Q);if(m&&+m[1]===1){const nx=T.slice(i+1,i+14).some(t=>t.s!==undefined&&CP_OPT.test(t.s)&&/^\s*(?:\*\*)?\(?A/i.test(t.s));if(nx){startIdx=i;break}}}
  sec={name:"Questions",short:"Questions",qs:[],perQ:null};ex.sections.push(sec);started=true}
 for(let i=0;i<T.length;i++){
  const tk=T[i];
  if(i<startIdx&&!hasSec){const p=tk.s===undefined?"":cpPlain(tk.s);
   if(p&&!main)main=p;if(/duration\W+\d+/i.test(p))ex.durationMinutes=+p.match(/duration\W+(\d+)/i)[1];
   if(/total\s*marks\W+\d+/i.test(p))declared=+p.match(/total\s*marks\W+(\d+(?:\.\d+)?)/i)[1];
   if(/^topics?\W/i.test(p))ex.topic=p.replace(/^topics?\W+/i,"").trim();continue}
  if(tk.code){
   if(inKey){continue}
   if(q&&q.opts.length){const o=q.opts[q.opts.length-1];o.code=(o.code||[]).concat(tk.code)}
   else if(q)q.blocks.push({code:tk.code});
   continue}
  const raw1=tk.s,t=raw1.trim(),p=cpPlain(raw1);
  if(inKey){keyLines.push(t);continue}
  if(!t){if(q&&!q.opts.length)q.blocks.push({gap:1});continue}
  if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){closeQ();continue}
  if(CP_KEYHEAD.test(t)){closeQ();inKey=true;continue}
  if(/^(\*\*)?\s*end of (the )?exam/i.test(t)||/^(\*\*)?\s*teacher'?s? note/i.test(t)){closeQ();started=started;continue}
  const sm=t.match(CP_SEC);
  if(sm){newSec(sm[1],sm[2]);continue}
  /* front matter (before the first section) */
  if(!sec){
   if(/^#\s+/.test(t)&&!main){main=p;continue}
   if(/^##\s+/.test(t)){sub=p;continue}
   if(!main&&p&&!/^(duration|total marks|topics?|instructions)\b/i.test(p)){main=p;continue}
   if(/duration\W+\d+/i.test(p)){ex.durationMinutes=+p.match(/duration\W+(\d+)/i)[1];continue}
   if(/total\s*marks\W+\d+/i.test(p)){declared=+p.match(/total\s*marks\W+(\d+(?:\.\d+)?)/i)[1];continue}
   if(/^topics?\W/i.test(p)){ex.topic=p.replace(/^topics?\W+/i,"").trim();continue}
   if(/^instructions\b/i.test(p)){inInstr=true;continue}
   if(inInstr&&p)instr.push(p.replace(/^\d+[.)]\s*/,""));
   continue}
  /* inside a section */
  const mm=p.match(CP_MARKS);
  if(mm&&!q){sec.from=+mm[1];sec.to=+mm[2];const c=sec.to-sec.from+1,pq=+mm[3]/c;if(c>0&&pq>0)sec.perQ=pq;continue}
  const am=raw1.match(CP_ANS);
  if(q&&am){q.inline=am[1].toUpperCase();continue}
  const qm=raw1.match(CP_Q);
  if(qm){const num=+qm[1],bold=/^\s*\*\*/.test(raw1);
   const isQ=strict?bold:(num===expect);
   if(isQ){closeQ();q={num,blocks:[],opts:[],inline:null,sec};expect=num+1;
    if(qm[2].trim())q.blocks.push({s:qm[2].trim()});continue}}
  if(q){
   const om=raw1.match(CP_OPT);
   const want=q.opts.length?String.fromCharCode(65+q.opts.length):"A";
   if(om&&om[1].toUpperCase()===want){q.opts.push({s:[om[2].trim()].filter(Boolean),code:null,letter:want});continue}
   if(q.opts.length){const o=q.opts[q.opts.length-1];if(t)o.s.push(t);continue}
   q.blocks.push({s:t});continue}
  /* text between the marks line and the first question is ignored */
 }
 closeQ();
 /* ----- assemble ----- */
 ex.title=cpTitle(main||"Computing examination")+(sub?" \u2013 "+cpTitle(sub):"");
 const lv=(sub||main).match(/year\s*(\d+)\s*[–\-—to]+\s*(\d+)/i)||(sub||main).match(/year\s*(\d+)/i);
 ex.level=lv?("Year "+lv[1]+(lv[2]?"\u2013"+lv[2]:"")):"";
 if(!ex.durationMinutes)ex.durationMinutes=40;
 if(instr.length&&ex.sections[0])ex.sections[0].instructions=instr.join(" ");
 const key=Object.assign({},cpKey(keyLines.join("\n")),cpKey(keyTxt||""));
 const missing=[],all=[];let total=0,total0=0;
 const secOut=ex.sections.map(s=>{const out={name:s.name,short:s.short,instructions:s.instructions||"",questions:[]};
  s.qs.forEach(q=>{
   /* prompt */
   const parts=[];let para=[];const flush=()=>{if(para.length){parts.push(para.map(cpInline).join("<br>"));para=[]}};
   q.blocks.forEach(b=>{if(b.code){flush();parts.push('<pre class="code">'+cpEsc(b.code.join("\n").replace(/^\n+|\n+$/g,""))+"</pre>")}else if(b.gap){flush()}else para.push(b.s)});flush();
   const prompt=parts.join('<div style="height:6px"></div>').replace(/<\/pre><div style="height:6px"><\/div>/g,"</pre>");
   const opts=q.opts.map(o=>{let txt=o.s.map(cpPlain).join(" ").trim(),mark=false;
    if(o.code&&o.code.length){const c=o.code.join("\n").replace(/^\n+|\n+$/g,"");txt=txt?txt+"\n"+c:c}
    if(/(\u2713|\(correct\)|\[correct\])\s*$/i.test(txt)){mark=true;txt=txt.replace(/\s*(\u2713|\(correct\)|\[correct\])\s*$/i,"")}
    return{txt,mark,letter:o.letter}});
   opts.forEach((o,i)=>{if(o.mark&&!q.inline)q.inline=String.fromCharCode(65+i)});
   const letter=key[q.num]||q.inline||null;
   const marks=s.perQ||1;total0+=marks;
   if(!prompt)errs.push("Question "+q.num+": the question text is empty.");
   if(opts.length<2)errs.push("Question "+q.num+": needs at least 2 options (A, B, C ...).");
   else if(opts.some(o=>!o.txt))errs.push("Question "+q.num+": an option is empty.");
   let ai=-1;if(letter){ai=letter.charCodeAt(0)-65;if(ai<0||ai>=opts.length){errs.push("Question "+q.num+": the answer "+letter+" is not one of its options.");ai=-1}}
   else missing.push(q.num);
   out.questions.push({type:"mcq",marks,prompt,options:opts.map(o=>o.txt),answer:ai});all.push(q.num);total+=marks});
  if(s.from!=null&&s.qs.length&&s.qs.length!==s.to-s.from+1)warns.push(s.name+": the text says questions "+s.from+"\u2013"+s.to+" but "+s.qs.length+" questions were found.");
  return out});
 ex.sections=secOut.filter(s=>s.questions.length);
 secOut.filter(s=>!s.questions.length).forEach(s=>warns.push(s.name+" has no questions and was skipped."));
 if(!all.length)errs.push("No questions were found. Questions must look like  1. Question text  followed by  A. option  B. option ...");
 for(let i=1;i<all.length;i++)if(all[i]!==all[i-1]+1){warns.push("Question numbers jump from "+all[i-1]+" to "+all[i]+".");break}
 if(missing.length)errs.push("No answer was given for "+(missing.length>12?missing.length+" questions (first: "+missing.slice(0,12).join(", ")+"...)":"question"+(missing.length>1?"s":"")+" "+missing.join(", "))+". Type the answers in the Answer key box, like:  1 B, 2 C, 3 A ... (or add a line  Answer: B  under each question).");
 const unused=Object.keys(key).filter(n=>!all.includes(+n));if(unused.length&&all.length)warns.push("The answer key has answers for questions that do not exist: "+unused.slice(0,10).join(", ")+".");
 if(declared!=null&&all.length&&Math.abs(declared-total)>1e-9)warns.push("The text says Total Marks: "+declared+" but the questions add up to "+total+".");

 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;max-width:720px" role="img" aria-label="Progress chart">${grid}${caPts}<path d="${line(items.map(i=>+i.pct))}" fill="none" stroke="#1d3f8f" stroke-width="3" stroke-linejoin="round"/>${dots}</svg><p class="note" style="margin:2px 0 0"><span style="color:#1d3f8f">\u25cf</span> You &nbsp; <span style="color:#b8923a">\u25cf</span> Class average (dashed)</p>`}
function reportHtml(d,staff){
 const it=d.items||[],todo=d.todo||[],avg=avgOf(it.map(i=>+i.pct)),best=it.length?Math.max(...it.map(i=>+i.pct)):null,last=it[it.length-1];
 const wt=weakTopics(it),strong=wt.filter(t=>t.pct>=75).slice(-3).reverse(),weak=wt.filter(t=>t.pct<60).slice(0,3);
 const trend=it.length>1?(+last.pct>+it[it.length-2].pct+3?"\u25b2 Going up":+last.pct<+it[it.length-2].pct-3?"\u25bc Going down":"\u25ac Steady"):"\u2013";
 const badges=[];
 if(it.length&&!todo.length)badges.push(["\u2705","All assessments done"]);
 if(it.length>1&&+last.pct-+it[0].pct>=10)badges.push(["\ud83d\udcc8","Improving"]);
 const vs=it.filter(i=>i.class_avg!=null&&i.class_n>=3).map(i=>+i.pct-i.class_avg);if(vs.length&&avgOf(vs)>0)badges.push(["\u2b50","Above the class average"]);
 if(best!=null&&best>=90)badges.push(["\ud83c\udfc6","Scored 90% or more"]);
 if(it.length>=3&&it.every(i=>+i.pct>=50))badges.push(["\ud83d\udd25","Passed every assessment"]);
 const need=it.length&&avg<75?Math.round(75*(it.length+1)-it.reduce((t,i)=>t+ +i.pct,0)):null;
 return`<div class="rpt"><div class="rpt-h"><div><div class="rpt-k">PROGRESS REPORT \u00b7 ${sv(d.subject.toUpperCase())}</div><h2>${sv(d.student.name)}</h2><div class="rpt-s">${sv(d.student.cls)} \u00b7 Year ${sv(d.student.year)}${d.student.adm?" \u00b7 Adm. "+sv(d.student.adm):""}</div></div><div class="rpt-g"><b>${avg==null?"\u2013":gr(avg)}</b><span>Overall grade</span></div></div>
<div class="tiles"><div class="tile"><b>${it.length}</b><span>Assessments done</span></div><div class="tile"><b>${avg==null?"\u2013":avg+"%"}</b><span>Average</span></div><div class="tile"><b>${best==null?"\u2013":best+"%"}</b><span>Best result</span></div><div class="tile"><b style="font-size:1.2rem">${trend}</b><span>Latest trend</span></div></div>
${badges.length?`<div class="rpt-b">${badges.map(b=>`<span class="rpt-bd"><i>${b[0]}</i>${sv(b[1])}</span>`).join("")}</div>`:""}
${it.length?`<h3>Your progress</h3>${chartSvg(it)}`:'<div class="msg">No assessment has been marked for you yet.</div>'}
${it.length?`<h3>Your results</h3><div class="tw"><table><tr><th>Tag</th><th>Assessment</th><th>Date</th><th>Marks</th><th>%</th><th>Grade</th><th>Class avg</th></tr>${it.map(i=>{const dv=i.class_avg==null?"":(+i.pct-i.class_avg);return`<tr><td><b>${sv(i.tag||"\u2013")}</b></td><td>${sv(i.title)}</td><td>${fmtDate(i.sub)}</td><td>${sv(i.total)}/${sv(i.max_marks)}</td><td><div class="pbar2"><i style="width:${i.pct}%;background:${col(+i.pct)}"></i></div> <b>${i.pct}%</b></td><td>${sv(i.grade)}</td><td>${i.class_avg==null?"\u2013":i.class_avg+"%"} ${dv===""?"":`<span style="color:${dv>=0?"#1d7a4d":"#c0392b"}">${dv>=0?"\u25b2":"\u25bc"}${Math.abs(dv)}</span>`}</td></tr>`}).join("")}</table></div>`:""}
${(strong.length||weak.length)?`<div class="rpt-2"><div><h3>Your strong topics</h3>${strong.length?strong.map(t=>`<div class="rpt-t ok"><b>${sv(t.name)}</b><span>${t.pct}%</span></div>`).join(""):'<p class="note">Keep working. Strong topics will appear here.</p>'}</div><div><h3>Topics to revise</h3>${weak.length?weak.map(t=>`<div class="rpt-t bad"><b>${sv(t.name)}</b><span>${t.pct}%</span></div>`).join(""):'<p class="note">No weak topic. Well done.</p>'}</div></div>`:""}
${(need!=null||todo.length||weak.length)?`<h3>Your next steps</h3><ul class="rpt-n">${need!=null&&need<=100?`<li>To reach an average of <b>75% (grade A)</b>, aim for about <b>${Math.max(0,need)}%</b> in your next assessment.</li>`:need!=null?`<li>Reaching an average of 75% will take your next two or three assessments. Keep improving step by step.</li>`:""}${weak.map(t=>`<li>Revise <b>${sv(t.name.replace(/^Section [A-Z0-9]+:\s*/i,""))}</b> and ask your teacher for extra practice.</li>`).join("")}${todo.length?`<li>You have not done: <b>${todo.slice(0,6).map(x=>sv(x.tag||x.title)).join(", ")}</b>. Ask your teacher when you can sit ${todo.length>1?"them":"it"}.</li>`:""}</ul>`:""}
<h3>Teacher's comment</h3><div class="rpt-c">${d.comment?sv(d.comment).replace(/\n/g,"<br>"):'<span class="note">Your teacher has not written a comment yet.</span>'}</div>
<p class="note">Report date: ${new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"})}</p></div>`}
function staffProfile(rid,d,B){
 const r=B.byId[rid],lr=localReport(r,d);
 const o=mgModal(`<div class="row" style="margin:0 0 8px"><button class="btn sm" id="pf-c">${lr.comment?"Edit comment":"Add comment"}</button><button class="btn sm alt" id="pf-p">Print / save as PDF</button><button class="btn sm alt" id="pf-x">Close</button></div><div id="pf-b">${reportHtml(lr,true)}</div>`);
 o.firstChild.style.maxWidth="860px";o.style.alignItems="flex-start";const q=s=>o.querySelector(s);
 q("#pf-x").onclick=()=>o.remove();q("#pf-p").onclick=()=>printHtml(reportCss()+q("#pf-b").innerHTML,r.name);
 q("#pf-c").onclick=()=>commentEditor(rid,B,d,()=>{o.remove();caDraw();staffProfile(rid,d,caBuild(d))})}
const reportCss=()=>`<style>.rpt{max-width:760px}.rpt-h{display:flex;justify-content:space-between;gap:12px;border-bottom:4px solid #b8923a;padding-bottom:8px}.rpt-k{font-size:11px;letter-spacing:.1em;color:#6b7590}.rpt h2{margin:2px 0;font-size:24px}.rpt-g{text-align:center}.rpt-g b{font-size:34px;display:block;color:#1d3f8f}.tiles{display:flex;gap:10px;margin:10px 0}.tile{flex:1;border-left:4px solid #b8923a;background:#f3f5fa;padding:6px 10px;display:flex;flex-direction:column}.tile b{font-size:20px}.tile span{font-size:11px;color:#6b7590}.rpt-bd{display:inline-block;margin:2px 4px 2px 0;padding:2px 10px;border-radius:99px;border:1px solid #b8923a;font-size:12px}.rpt-bd i{font-style:normal;margin-right:4px}.pbar2{display:inline-block;width:70px;height:8px;background:#e1e5ee;border-radius:9px;overflow:hidden;vertical-align:middle}.pbar2 i{display:block;height:100%}.rpt-2{display:flex;gap:14px}.rpt-2>div{flex:1}.rpt-t{display:flex;justify-content:space-between;border-left:4px solid #1d7a4d;background:#eef7f1;padding:4px 8px;margin:4px 0}.rpt-t.bad{border-color:#c0392b;background:#fbeeee}.rpt-c{border-left:4px solid #b8923a;background:#fbf7ec;padding:10px 12px;border-radius:6px}.note{font-size:11px;color:#6b7590}h3{margin:14px 0 4px}</style>`;

/* ---- student page: #/report ---- */
const RP={year:0,wing:"",name:"",cls:""};
function reportPage(){
 const ys=SUBJECTS.flatMap(s=>s.years.map(y=>[y,s.n]));
 return crumb([["Home","#/"],["My progress report"]])+`<div class="ph"><h1>MY PROGRESS REPORT</h1><div class="rule"></div><p>See all your results, your progress, topics to revise and your teacher's comment.</p></div>
<div class="panel gate"><label>1. Choose your year</label><div class="rp-yrs">${ys.map(([y,n])=>`<button type="button" class="rp-b${RP.year===y?" on":""}" data-ry="${y}"><b>Year ${y}</b><span>${sv(n)}</span></button>`).join("")}</div>
<label>2. Choose your wing</label><div class="rp-yrs"><button type="button" class="rp-b${RP.wing==="Boys"?" on":""}" data-rw="Boys"><b>BOYS</b></button><button type="button" class="rp-b${RP.wing==="Girls"?" on":""}" data-rw="Girls"><b>GIRLS</b></button></div>
<label for="rp-n">3. Type the first letters of your name, then tap your name</label><input id="rp-n" value="${sv(RP.name)}" autocomplete="off" placeholder="Choose your year and wing first"><div id="rp-l" class="nlist" hidden></div>
<div id="rp-pw"></div><div id="rp-e"></div><div class="row"><button class="btn" id="rp-go">Show my report</button><a class="btn alt" href="#/">Back</a></div></div><div id="rp-out"></div>`}
function bindReportPage(){
 const inp=$("#rp-n"),box=$("#rp-l");let seq=0,tm;
 const pwBox=()=>{$("#rp-pw").innerHTML=RP.year&&db.pw[RP.year]?`<label for="rp-p">4. Class password (from your teacher)</label><input id="rp-p" type="password" autocomplete="off">`:""};
 const draw=async()=>{const v=inp.value.trim(),my=++seq;if(!RP.year||!RP.wing||!v){box.hidden=true;return}
  let r=await rpc("list_students",{p_year:RP.year,p_wing:RP.wing,p_prefix:v});let list=r.ok&&Array.isArray(r.j)?r.j:null;
  if(!list){const f=await rpc("find_students",{p_q:v,p_year:RP.year});list=f.ok&&Array.isArray(f.j)?f.j:[]}
  if(my!==seq)return;box.hidden=false;
  box.innerHTML=list.length?`<div class="nl-h">${list.length} name${list.length>1?"s":""} found</div>`+list.map(x=>`<button type="button" class="ni" data-n="${sv(x.name)}" data-c="${sv(x.cls)}"><span>${sv(x.name)}</span><span class="tag">${sv(x.cls)}</span></button>`).join(""):'<div class="nl-h">No name found. Check the year, the wing and the first letters.</div>'};
 const unlock=()=>{inp.disabled=!(RP.year&&RP.wing);inp.placeholder=inp.disabled?"Choose your year and wing first":"Type the first letters of your name"};unlock();pwBox();
 $$("[data-ry]").forEach(b=>b.onclick=()=>{RP.year=+b.dataset.ry;RP.name="";RP.cls="";$$("[data-ry]").forEach(x=>x.classList.toggle("on",x===b));inp.value="";unlock();pwBox();draw()});
 $$("[data-rw]").forEach(b=>b.onclick=()=>{RP.wing=b.dataset.rw;RP.name="";RP.cls="";$$("[data-rw]").forEach(x=>x.classList.toggle("on",x===b));inp.value="";unlock();draw();inp.focus()});
 inp.addEventListener("input",()=>{RP.name=inp.value;RP.cls="";clearTimeout(tm);tm=setTimeout(draw,150)});
 box.addEventListener("click",e=>{const b=e.target.closest("[data-n]");if(!b)return;inp.value=b.dataset.n;RP.name=b.dataset.n;RP.cls=b.dataset.c;box.hidden=true});
 $("#rp-go").onclick=async()=>{const bad=m=>{$("#rp-e").innerHTML='<div class="msg bad">'+m+"</div>"},n=inp.value.trim();$("#rp-e").innerHTML="";
  if(!RP.year||!RP.wing||!n)return bad("Choose your year, your wing and your name.");
  if(db.pw[RP.year]){const p=$("#rp-p")?$("#rp-p").value:"";if(!await gateOk(RP.year,p))return bad("The class password is not correct.")}
  const btn=$("#rp-go");btn.disabled=true;btn.textContent="Loading\u2026";
  const r=await rpc("student_report",{p_name:n,p_year:RP.year,p_pw:ss_get("ca_pwh_"+RP.year)||"",p_cls:RP.cls||null});btn.disabled=false;btn.textContent="Show my report";
  const M={closed:"Reports are not open yet. Your teacher will open them soon.",password:"The class password is not correct.",student:"Your name is not on the class list for this year. Pick it from the list.",ambiguous:"Your name matches more than one student. Tell your teacher."};
  if(!(r.ok&&r.j&&r.j.ok))return bad(r.status===404?"Reports are not set up yet. Tell your teacher.":(r.j&&M[r.j.err])||"Could not load your report. Check your internet.");
  const out=$("#rp-out");out.innerHTML=`<div class="panel" id="rp-card">${reportHtml(r.j,false)}<div class="row"><button class="btn" id="rp-print">Print / save as PDF</button></div></div>`;
  $("#rp-print").onclick=()=>printHtml(reportCss()+$("#rp-card .rpt").outerHTML,n);out.scrollIntoView({behavior:"smooth"})}}
{const _route=route;
 route=function(){
  if(/^#\/report/.test(location.hash)&&!(typeof EX!=="undefined"&&EX&&!EX.released)){
   if(!(isStaff()===false&&typeof pendingExam==="function"&&pendingExam())){
    db=API.load();app.innerHTML=reportPage();bindReportPage();$$("nav a").forEach(a=>a.classList.toggle("on",a.dataset.k==="report"));$("#nav").classList.remove("open");return}}
  return _route.apply(this,arguments)}}

  const i=h.lastIndexOf("</div>");return h.slice(0,i)+'<a class="card" href="#/report"><h3>MY PROGRESS REPORT</h3><p>Your results, progress and teacher\'s comment</p></a>'+h.slice(i)}}
(()=>{const n=$("#nav");if(n&&!n.querySelector('[data-k="report"]')){const a=document.createElement("a");a.href="#/report";a.dataset.k="report";a.textContent="MY REPORT";const st=n.querySelector('[data-k="staff"]');n.insertBefore(a,st||null)}})();

})();
