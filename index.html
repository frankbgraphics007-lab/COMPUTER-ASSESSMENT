<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Computer Assessment Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky navy bar, hero with school logo plate, card grids for subject > year > category, full-screen exam shell for HTML exams. */
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--navy:#0b1a3a;--royal:#1d3f8f;--gold:#b8923a;--goldl:#e9d9ae;--bg:#f5f6f9;--card:#ffffff;--ink:#16213b;--mut:#5b6580;--line:#dfe3ec;--ok:#1d7a4d;--bad:#a8322d;--link:#1d3f8f;--msg-bg:#fbf3de;--msg-ink:#5a4410;--msg-line:#e9d9ae;--bad-bg:#fbe9e8;--bad-line:#e8b9b6;--field:#f5f6f9;--good-bg:#e9f6ee;--good-ink:#14532d;--good-line:#9bd3b3;
 --serif:"Cormorant Garamond",Georgia,serif;--sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1226;--card:#111d3a;--ink:#eef1f8;--mut:#9aa6c4;--line:#243258;--link:#9db7ff;--msg-bg:#2a2412;--msg-ink:#ecd9a0;--msg-line:#5a4a1c;--bad-bg:#2f1514;--bad-ink:#ffb4ae;--bad-line:#6b2a27;--bad:#ff8f87;--ok:#5fd29a;--field:#0a1226;--good-bg:#10281b;--good-ink:#9fe3bb;--good-line:#25573a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1226;--card:#111d3a;--ink:#eef1f8;--mut:#9aa6c4;--line:#243258;--link:#9db7ff;--msg-bg:#2a2412;--msg-ink:#ecd9a0;--msg-line:#5a4a1c;--bad-bg:#2f1514;--bad-ink:#ffb4ae;--bad-line:#6b2a27;--bad:#ff8f87;--ok:#5fd29a;--field:#0a1226;--good-bg:#10281b;--good-ink:#9fe3bb;--good-line:#25573a;color-scheme:dark}
:root{--bad-ink:#a8322d}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans)}
body.exam-on{overflow:hidden}
h1,h2,h3{font-family:var(--serif);margin:0;line-height:1.1;color:var(--ink);text-wrap:balance}
h2{font-size:1.7rem}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
header{background:var(--navy);border-bottom:3px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:9}
.bar{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:12px}
.brand{display:flex;gap:12px;align-items:center;color:#fff;min-width:0}
.plate{background:#fff;border-radius:4px;padding:4px 8px;display:flex;align-items:center;flex:none}
.plate img{height:34px;width:auto;display:block}
.brand .txt{font-family:var(--serif);font-weight:700;font-size:1.3rem;letter-spacing:.06em;white-space:nowrap}
@media(max-width:520px){.brand .txt{font-size:1rem;letter-spacing:.03em}.plate img{height:28px}}
@media(max-width:380px){.brand .txt{display:none}}
nav{display:flex;gap:4px}
nav a{color:#c9d3ee;padding:8px 14px;font-weight:600;font-size:.88rem;letter-spacing:.05em;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
nav a:hover{color:#fff;border-color:rgba(233,217,174,.5)}nav a.on{color:var(--goldl);border-color:var(--gold)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--bad);color:#fff;font-size:.75rem;text-align:center}
#mb{display:none;background:none;border:1px solid #3a4c82;color:#fff;padding:6px 12px;border-radius:4px}
@media(max-width:760px){#mb{display:block}nav{display:none;position:absolute;left:0;right:0;top:100%;background:var(--navy);flex-direction:column;padding:8px 16px 16px}nav.open{display:flex}}
main{max-width:1120px;margin:auto;padding:32px 16px 64px;min-height:70vh}
.hero{background:linear-gradient(135deg,var(--navy),#14307a);color:#fff;border-radius:6px;padding:56px 40px;border-bottom:4px solid var(--gold);display:grid;grid-template-columns:1fr auto;gap:36px;align-items:center}
.hero>div{min-width:0}
.hero h1{color:#fff;font-size:clamp(2.3rem,7vw,4.4rem);letter-spacing:.04em;font-weight:700}
.hero p{color:var(--goldl);font-size:1.2rem;max-width:46ch;margin:14px 0 28px}
.hero .plate{padding:22px 26px;border-bottom:4px solid var(--gold);border-radius:6px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.hero .plate img{height:150px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:36px 24px}.hero .plate{order:-1;justify-self:start}.hero .plate img{height:96px}}
/* Buttons and cards: gold glow and a light ring that travels around the outside edge on hover or keyboard focus */
.btn,a.card,button.card{position:relative;isolation:isolate;transition:transform .25s,box-shadow .3s,background .2s,border-color .2s}
.btn{display:inline-block;padding:11px 22px;border-radius:4px;font-weight:600;border:1px solid var(--gold);background:var(--gold);color:#0b1a3a;--r:4px;line-height:1.3}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(233,217,174,.6)}
.btn.alt{background:transparent;color:var(--link);border-color:var(--line)}
.btn.sm{padding:6px 14px;font-size:.88rem}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
a.card,button.card{--r:6px}
.btn::before,a.card::before,button.card::before{content:"";position:absolute;inset:-4px;border-radius:calc(var(--r) + 4px);padding:2px;pointer-events:none;z-index:-1;opacity:0;transition:opacity .3s;
 background:conic-gradient(from var(--a),transparent 0 55%,rgba(184,146,58,.9) 85%,#fff 100%),linear-gradient(rgba(184,146,58,.35),rgba(184,146,58,.35));
 -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
 animation:orbit 2.4s linear infinite paused}
@keyframes orbit{to{--a:360deg}}
.btn:not(:disabled):is(:hover,:focus-visible)::before,a.card:is(:hover,:focus-visible)::before,button.card:is(:hover,:focus-visible)::before{opacity:1;animation-play-state:running}
.btn:not(:disabled):is(:hover,:focus-visible){transform:translateY(-1px);box-shadow:0 0 18px rgba(184,146,58,.55),0 6px 16px rgba(0,0,0,.18)}
.btn:not(.ghost):not(.alt):not(.danger):not(:disabled):hover{background:var(--goldl)}
.btn.ghost:not(:disabled):hover{background:rgba(184,146,58,.16)}
.btn.alt:not(:disabled):hover{background:rgba(184,146,58,.1)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--royal);border-radius:6px;padding:22px;box-shadow:0 2px 10px rgba(11,26,58,.06);display:block;min-width:0}
a.card:hover,button.card:hover{transform:translateY(-3px);border-top-color:var(--gold);box-shadow:0 0 22px rgba(184,146,58,.4),0 10px 24px rgba(11,26,58,.16)}
.card h3{font-size:1.5rem;margin-bottom:6px;overflow-wrap:anywhere}.card p{margin:0;color:var(--mut);font-size:.95rem}
.tag{display:inline-block;font-size:.78rem;font-weight:600;padding:2px 10px;border:1px solid var(--line);border-radius:20px;color:var(--mut);margin:0 6px 4px 0}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.crumb{color:var(--mut);font-size:.9rem;margin-bottom:10px}.crumb a{color:var(--link);font-weight:600}.crumb a:hover{text-decoration:underline}
.ph h1{font-size:clamp(2rem,5vw,3rem)}.ph p{color:var(--mut);margin:8px 0 0}
.rule{height:3px;width:64px;background:var(--gold);margin:14px 0 0}
.empty{border:1px dashed var(--line);border-radius:6px;padding:40px 20px;text-align:center;color:var(--mut);margin-top:24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:24px;margin-top:22px;min-width:0}
.gate{max-width:640px}
.rules{padding-left:20px;margin:12px 0 0;display:grid;gap:8px}
label{display:block;font-weight:600;font-size:.9rem;margin:14px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--field);color:var(--ink);font:inherit}
input[type=radio],input[type=checkbox]{width:auto}
.chk{display:flex;gap:10px;align-items:center;font-weight:400;margin:10px 0 0}
.two{display:grid;gap:14px;grid-template-columns:1fr 1fr}@media(max-width:640px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:.93rem}td,th{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tw{overflow-x:auto}
.msg{padding:10px 14px;border-radius:4px;margin-top:14px;font-size:.92rem;background:var(--msg-bg);color:var(--msg-ink);border:1px solid var(--msg-line)}
.msg.bad{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--bad-line)}
.viewer{width:100%;height:78vh;border:1px solid var(--line);border-radius:6px;background:#fff;margin-top:16px}
.viewer.img{height:auto;max-height:80vh;object-fit:contain}
.note{font-size:.85rem;color:var(--mut);margin-top:10px}
footer{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:.85rem;padding:24px 16px;border-top:1px solid var(--line)}
footer .plate{border:1px solid var(--line)}footer .plate img{height:30px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border:1px solid var(--gold);padding:10px 16px;border-radius:6px;z-index:3000;max-width:min(92vw,520px);box-shadow:0 0 20px rgba(184,146,58,.4)}
/* Live panel (staff) */
.lv{border:1px solid var(--line);border-left:4px solid var(--royal);border-radius:6px;padding:14px 16px;margin-top:12px;background:var(--card)}
.lv.help{border-left-color:var(--bad);background:var(--bad-bg)}
.lv.paused{border-left-color:var(--gold)}.lv.done,.lv.ended{border-left-color:var(--ok)}
.lv-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.lv-h strong{font-size:1.05rem}
.lv details{margin-top:8px;font-size:.88rem;color:var(--mut)}.lv ul{margin:6px 0 0;padding-left:18px}
.lv-r{margin:8px 0 0}
/* Exam shell */
.ex{position:fixed;inset:0;z-index:1000;background:var(--navy);display:flex;flex-direction:column;color:#fff}
.ex-bar{display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--navy);border-bottom:2px solid var(--gold);flex-wrap:wrap}
.ex-bar .plate img{height:30px}
.ex-t{font-family:var(--serif);font-weight:700;font-size:1.2rem;flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-st{font-size:.82rem;font-weight:600;padding:3px 12px;border-radius:20px;border:1px solid var(--goldl);color:var(--goldl)}
.ex-st.bad{border-color:#ff8f87;color:#ff8f87}.ex-st.ok{border-color:#5fd29a;color:#5fd29a}
.ex-body{flex:1;min-height:0;background:#fff;position:relative}
.ex-body iframe{width:100%;height:100%;border:0;background:#fff;display:block}
.cover{position:absolute;inset:0;background:var(--navy);display:grid;place-items:center;padding:24px;z-index:5;text-align:center}
.cv{max-width:480px}.cv h2{color:#fff;font-size:2rem}.cv p{color:#c9d3ee;margin:12px 0 22px}
.hm{background:var(--card);color:var(--ink);border-radius:6px;border-top:4px solid var(--gold);padding:24px;max-width:480px;width:100%;text-align:left;max-height:100%;overflow:auto}
.hm h2{color:var(--ink)}.hm fieldset{border:0;padding:0;margin:14px 0 0}.hm legend{font-weight:600;margin-bottom:4px;padding:0}
summary{cursor:pointer;font-weight:600}
.msg.good{background:var(--good-bg);color:var(--good-ink);border-color:var(--good-line)}
/* Teacher message composer */
.cmp{display:grid;gap:2px;margin-top:8px;color:var(--ink)}
.cmp-p{margin:8px 0 0;padding:8px 12px;border-left:3px solid var(--gold);background:var(--field);font-size:.9rem;color:var(--ink)}
.cmp-p:empty{display:none}
.lv.all{border-left-color:var(--gold)}
.lv>details>summary{color:var(--ink)}
/* Formal notice shown to a student */
#exmsg{z-index:50;background:rgba(6,14,32,.9)}
.nt{background:var(--card);color:var(--ink);width:min(560px,100%);border-radius:6px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:left;max-height:100%;overflow-y:auto}
.nt-h{display:flex;gap:14px;align-items:center;padding:14px 18px;background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.nt-h .plate img{height:38px}
.nt-k{font:700 1.3rem/1.1 var(--serif);letter-spacing:.05em;text-transform:uppercase}
.nt-s{font-size:.8rem;color:var(--goldl)}
.nt.w .nt-h{background:#5a3d06;border-bottom-color:#e0a21a}
.nt.f .nt-h{background:#6e1b17;border-bottom-color:#ff8f87}
.nt-b{padding:22px 24px 24px}
.nt-b h2{font-size:1.8rem}
.nt-m{margin:14px 0 0;font-size:1.12rem;line-height:1.5}
.nt-w{margin:14px 0 0;font-weight:600;color:var(--bad)}
.nt-f{margin:14px 0 0;font-size:.85rem;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
</style>

async function sb(path,opt,retry){

 }catch(e){return{ok:false,status:0,j:null}}}

/* Splits an exam into a PUBLIC page (no answers) and a PRIVATE answer key that stays on the server. */
function splitExam(text,aid){
 const m=text.match(/(<script id="exam-data" type="application\/json">)([\s\S]*?)(<\/script>)/);
 if(!m||!m[2].trim())return null;
 let ex;try{ex=JSON.parse(m[2])}catch(e){return null}
 if(!ex||!Array.isArray(ex.sections))return null;
 const key=JSON.parse(JSON.stringify(ex));
 ex.remote=true;ex.aid=aid;
 ex.sections.forEach(s=>s.questions.forEach(q=>{
  switch(q.type){
   case"mcq":case"tf":delete q.answer;break;
   case"multi":case"fill":delete q.answers;break;
   case"match":q.rights=[...new Set(q.pairs.map(p=>p[1]))].sort();q.pairs=q.pairs.map(p=>[p[0],""]);break;
   case"order":delete q.correct;break;
   case"sort":q.items=q.items.map(x=>({t:x.t}));break;
   case"convert":case"binadd":break;
   default:delete q.answer;delete q.tol;delete q.exact}}));
 const pub=text.replace(m[0],()=>m[1]+JSON.stringify(ex).replace(/</g,"\\u003c")+m[3]);
 return{pub,key}}

async function syncDb(){
 const prev=_snap,next=_db;let fail=false;
 const bad=r=>{if(!r.ok){fail=true;if(r.status===401||r.status===403)ss_set("ca_err","auth")}return r.ok};
 const pm=new Map(prev.a.map(a=>[a.id,a]));
 for(const a of next.a){
  const old=pm.get(a.id),m=metaOf(a),sig=urlSig(a);
  const metaChanged=!old||JSON.stringify(metaOf(old))!==JSON.stringify(m)&&true;
  const newContent=a.kind!=="link"&&a.url&&(!old||old._u!==sig);
  if(newContent){
   let body=null,path=null;
   if(a.kind==="html"){
    const text=dataToText(a.url),sp=splitExam(text,a.id);
    if(sp){body=sp.pub;if(!bad(await sb("/rest/v1/exam_keys?on_conflict=aid",{method:"POST",body:JSON.stringify({aid:a.id,data:sp.key}),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}})))continue}
    else{body=text;await sb("/rest/v1/exam_keys?aid=eq."+enc(a.id),{method:"DELETE"})}
   }else{
    const ext=(a.file||"").split(".").pop().toLowerCase().replace(/[^a-z0-9]/g,"")||"bin";
    path=a.id+"-"+Math.random().toString(36).slice(2,10)+"."+ext;
    const up=await sb("/storage/v1/object/assessment-files/"+path,{method:"POST",body:dataToBlob(a.url,a.kind),headers:{"Content-Type":MIME[a.kind]||"application/octet-stream","x-upsert":"true"}});
    if(!bad(up))continue;
   }
   const o=await rows("assessments","id=eq."+enc(a.id)+"&select=path");
   if(!bad(await sb("/rest/v1/assessments?on_conflict=id",{method:"POST",body:JSON.stringify({id:a.id,meta:m,body,path}),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}})))continue;
   const oldp=o.ok&&o.j&&o.j[0]&&o.j[0].path;if(oldp&&oldp!==path)sb("/storage/v1/object/assessment-files/"+oldp,{method:"DELETE"})
  }else if(a.kind==="link"&&(!old||metaChanged||old._u!==sig)){
   bad(await sb("/rest/v1/assessments?on_conflict=id",{method:"POST",body:JSON.stringify({id:a.id,meta:m}),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}}))
  }else if(old&&JSON.stringify(metaOf(old))!==JSON.stringify(m)){
   bad(await sb("/rest/v1/assessments?id=eq."+enc(a.id),{method:"PATCH",body:JSON.stringify({meta:m}),headers:{Prefer:"return=minimal"}}))
  }}
 const ids=new Set(next.a.map(a=>a.id));
 for(const o of prev.a)if(!ids.has(o.id)){
  const p=await rows("assessments","id=eq."+enc(o.id)+"&select=path");
  bad(await sb("/rest/v1/assessments?id=eq."+enc(o.id),{method:"DELETE"}));
  await sb("/rest/v1/exam_keys?aid=eq."+enc(o.id),{method:"DELETE"});
  const pp=p.ok&&p.j&&p.j[0]&&p.j[0].path;if(pp)sb("/storage/v1/object/assessment-files/"+pp,{method:"DELETE"})}
 for(const y of new Set([...Object.keys(prev.pw),...Object.keys(next.pw)])){
  const nv=next.pw[y],pv=prev.pw[y];
  if(nv&&nv!==true&&nv!==pv)bad(await rpc("set_class_pw",{p_year:+y,p_hash:nv}));
  else if(!nv&&pv)bad(await rpc("clear_class_pw",{p_year:+y}))}
 if(JSON.stringify(prev.links)!==JSON.stringify(next.links))
  bad(await sb("/rest/v1/settings?on_conflict=key",{method:"POST",body:JSON.stringify({key:"links",value:next.links}),headers:{Prefer:"resolution=merge-duplicates,return=minimal"}}));
 if(fail)throw new Error("sync");
 _snap=lite(next)}

/* Live exam monitoring (students send a heartbeat; teachers read) */
const LiveRemote=(()=>{
 const L={},P={},T={},FL={};let lastList=0,listCache=[];
 const flush=async sid=>{if(FL[sid])return;const p=P[sid]||{};delete P[sid];T[sid]=Date.now();FL[sid]=1;
  const r=await rpc("live_patch",{p_sid:sid,p});delete FL[sid];
  if(r.ok&&r.j){Object.assign(L[sid]=L[sid]||{sid},r.j)}else P[sid]=Object.assign(p,P[sid]||{})};
 return{
  async patch(sid,p){const prev=L[sid]||{},o=L[sid]=Object.assign(prev,p);P[sid]=Object.assign(P[sid]||{},p);
   const h=JSON.stringify(o.help||null);
   const urgent=!T[sid]||("state"in p&&p.state!==prev._st)||("help"in p&&h!==prev._h)||"ackN"in p;o._st=o.state;o._h=h;
   if(urgent||Date.now()-T[sid]>HEARTBEAT_MS)await flush(sid);return o},
  async get(sid){if(!L[sid]){const r=await rpc("live_get",{p_sid:sid});if(r.ok&&r.j)L[sid]=r.j}return L[sid]||null},
  async list(){if(Date.now()-lastList>4500){lastList=Date.now();const r=await rpc("live_list");if(r.ok&&r.j)listCache=r.j.list||[]}
   const n=Date.now();return listCache.filter(s=>n-(s.hb||0)<12*36e5)},
  async command(sid,cmd){await rpc("live_command",{p_sid:sid,p_cmd:cmd});lastList=0},
  async message(sid,m){await rpc("live_message",{p_sid:sid,p_level:m.level,p_text:m.text});lastList=0},
  async remove(sid){await rpc("live_remove",{p_sid:sid});lastList=0;listCache=listCache.filter(s=>s.sid!==sid)}
 }})();
const Live=REMOTE?LiveRemote:LiveLocal;

  let j=null;try{j=await r.json()}catch(e){}
  if(r.ok&&j&&j.ok)return j;
  if(r.status>=400&&r.status<500&&r.status!==429)return{ok:false,fatal:true,msg:(j&&j.msg)||"Could not submit. Tell your teacher."};

const STL={help:"Needs help",paused:"Paused",active:"In exam",done:"Submitted",ended:"Ended by teacher"};
const LV={notice:"Notice",warning:"Warning",final:"Final warning"};
const MSGS=[
 {k:"silence",lv:"notice",name:"Silence in the examination room",text:"Silence is required in the examination room. Please continue working quietly and independently."},
 {k:"eyes",lv:"warning",name:"Keep your eyes on your own screen",text:"Please keep your eyes on your own screen. Looking at another candidate's work is not permitted."},
 {k:"talk",lv:"warning",name:"Stop talking",text:"This is a formal warning. Talking or communicating with other candidates is not permitted during the examination. Please stop immediately."},
 {k:"device",lv:"warning",name:"Unauthorised devices or materials",text:"Unauthorised devices and materials are not permitted in this examination. Put them away now."},
 {k:"focus",lv:"warning",name:"Stay on the exam page",text:"Activity outside the exam page has been recorded. Remain on the exam page for the rest of the examination."},
 {k:"final",lv:"final",name:"Final warning: exam may be ended",text:"This is your final warning. If this continues, your examination will be ended immediately."},
 {k:"time",lv:"notice",name:"Time reminder",text:"Please check the time. Review your answers and submit before time runs out."},
 {k:"custom",lv:null,name:"Write my own message",text:""}];
const DRAFT={};
const dr=k=>DRAFT[k]||(DRAFT[k]={p:"silence",l:"warning",t:"",o:false});
function msgOf(k){const d=dr(k);if(d.p==="custom")return{level:d.l,text:d.t.trim()};const m=MSGS.find(x=>x.k===d.p)||MSGS[0];return{level:m.lv,text:m.text}}
function compose(k,to){const d=dr(k),cu=d.p==="custom",id=esc(k);
 return `<div class="cmp"><label for="cp-${id}">Message</label><select id="cp-${id}" data-ck="${id}" data-f="p">${MSGS.map(m=>`<option value="${m.k}"${m.k===d.p?" selected":""}>${m.lv?LV[m.lv]+": ":""}${esc(m.name)}</option>`).join("")}</select>
<div id="cc-${id}"${cu?"":" hidden"}><label for="cl-${id}">Level</label><select id="cl-${id}" data-ck="${id}" data-f="l">${Object.keys(LV).map(x=>`<option value="${x}"${d.l===x?" selected":""}>${LV[x]}</option>`).join("")}</select><label for="ct-${id}">Your message</label><textarea id="ct-${id}" data-ck="${id}" data-f="t" rows="2" maxlength="240">${esc(d.t)}</textarea></div>
<p class="cmp-p" id="cv-${id}">${cu?"":esc(msgOf(k).text)}</p>
<div class="row" style="margin-top:8px"><button class="btn sm" data-send="${id}">Send to ${esc(to)}</button></div></div>`}
function ago(t){const s=Math.round((Date.now()-t)/1000);return s<60?s+"s ago":Math.round(s/60)+" min ago"}
function refreshLive(L){
 const box=$("#live");if(!box)return;
 const n=Date.now(),ACT=["active","help","paused"];L=L.slice().sort((a,b)=>(b.state==="help")-(a.state==="help")||String(a.name).localeCompare(b.name));
 const sig=JSON.stringify(L.map(s=>({...s,hb:n-(s.hb||0)>15000})));
 const nh=L.filter(s=>s.state==="help").length,bd=$("#lvbadge");if(bd){bd.hidden=!nh;bd.textContent=nh}
 if(sig===liveSig)return;
 const ae=document.activeElement;if(ae&&box.contains(ae)&&/^(TEXTAREA|SELECT)$/.test(ae.tagName))return;   // do not redraw while the teacher is choosing or typing
 liveSig=sig;
 if(!L.length){box.innerHTML='<div class="empty">No students are in an exam right now. They appear here when they begin a secure exam.</div>';return}
 const act=L.filter(s=>ACT.includes(s.state));
 const all=act.length>1?`<details class="lv all" data-ok="ALL"${dr("ALL").o?" open":""}><summary><b>Message all students in exams (${act.length})</b></summary>${compose("ALL","all "+act.length+" students")}</details>`:"";
 box.innerHTML=all+L.map(s=>{const off=ACT.includes(s.state)&&n-(s.hb||0)>15000,v=s.viol||[],sid=esc(s.sid),live=ACT.includes(s.state);
  let btn="";
  if(s.state==="help")btn=`<button class="btn sm" data-lc="allow" data-sid="${sid}">Pause exam and allow leave</button><button class="btn sm alt" data-lc="deny" data-sid="${sid}">Not now</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
  else if(s.state==="active")btn=`<button class="btn sm alt" data-lc="allow" data-sid="${sid}">Pause and allow leave</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
  else if(s.state==="paused")btn=`<button class="btn sm" data-lc="resume" data-sid="${sid}">Resume exam</button><button class="btn sm danger" data-lc="end" data-sid="${sid}">End exam</button>`;
  else btn=`<button class="btn sm alt" data-lc="clear" data-sid="${sid}">Remove from list</button>`;
  const acked=(s.ackN||0)>=(s.msgN||0),ms=s.msgs||[];
  return `<div class="lv ${esc(s.state)}"><div class="lv-h"><strong>${esc(s.name)}</strong><span class="tag">Year ${esc(s.year)}</span><span>${esc(s.title)}</span><span class="tag ${s.state==="help"?"bad":s.state==="done"||s.state==="ended"?"ok":""}">${STL[s.state]||esc(s.state)}</span>${off?'<span class="tag bad">No signal</span>':""}${v.length?`<span class="tag bad">${v.length} warning${v.length>1?"s":""}</span>`:""}${s.warns?`<span class="tag bad">${s.warns} formal warning${s.warns>1?"s":""} issued</span>`:""}</div>
${s.state==="help"&&s.help?`<p class="lv-r"><b>${esc(s.help.reason)}</b>${s.help.note?" “"+esc(s.help.note)+"”":""}</p>`:""}
${v.length?`<details><summary>Activity log</summary><ul>${v.slice(-8).reverse().map(x=>`<li>${new Date(x.t).toLocaleTimeString("en-GB")} · ${esc(x.msg)}</li>`).join("")}</ul></details>`:""}
${ms.length?`<details><summary>Messages sent (${s.msgN}) · last one ${acked?"acknowledged"+(s.ackT?" at "+new Date(s.ackT).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):""):"waiting for the student to acknowledge"}</summary><ul>${ms.slice().reverse().map(x=>`<li>${new Date(x.t).toLocaleTimeString("en-GB")} · ${LV[x.level]||""}: ${esc(x.text)}</li>`).join("")}</ul></details>`:""}
${live?`<details data-ok="${sid}"${dr(s.sid).o?" open":""}><summary>Send a message to ${esc(s.name)}</summary>${compose(s.sid,s.name)}</details>`:""}
<div class="row">${btn}</div></div>`}).join("")}
const alerted=new Set();
function beep(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();let t=ac.currentTime;for(let i=0;i<3;i++){const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.32);t+=.4}}catch(e){}}
async function watchLive(){
 const nb=$("#navbadge");
 if(!isStaff()){nb.hidden=true;document.title="Computer Assessment Portal";return}
 const L=await Live.list(),h=L.filter(s=>s.state==="help");
 h.forEach(s=>{const k=s.sid+":"+(s.help&&s.help.t);if(!alerted.has(k)){alerted.add(k);beep();toast(`Help request from ${s.name}: ${s.help?s.help.reason:""}`)}});
 nb.hidden=!h.length;nb.textContent=h.length;
 document.title=h.length?`(${h.length}) Help request · Computer Assessment`:"Computer Assessment Portal";
 if($("#live"))refreshLive(L);
}
